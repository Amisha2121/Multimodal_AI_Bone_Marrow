# Optimized Configuration for RTX 5050 Laptop (8GB VRAM)
# 
# RTX 5050 Specs:
#   - 8GB GDDR7 VRAM
#   - 2,560 CUDA cores (Blackwell architecture)
#   - 35-115W TGP (laptop variant)
#   - PCIe 5.0 x8
#
# This config balances training speed with memory constraints
# for multi-dataset training (~151,000 cells)

seed: 42

dataset:
  image_size: 224
  train_val_test_split: [0.70, 0.15, 0.15]

vision:
  backbone: "vit_small_patch16_224"
  pretrained: true
  lora:
    enabled: true
    r: 16  # Reduced from 32 to save memory
    alpha: 32  # Reduced from 64
    dropout: 0.1
    target_modules:
      - "qkv"
      - "proj"

training:
  # ══════════════════════════════════════════════════════════════════════
  # MEMORY OPTIMIZATION for 8GB VRAM
  # ══════════════════════════════════════════════════════════════════════
  
  # Batch size: 24 fits comfortably in 8GB with gradient accumulation
  batch_size: 24  # Reduced from 32
  
  # Gradient accumulation: Effective batch size = 24 * 2 = 48
  gradient_accumulation_steps: 2
  
  # Mixed precision: BF16 is faster on Blackwell architecture
  precision: "bf16"  # Blackwell has native BF16 support (faster than FP16)
  
  # ══════════════════════════════════════════════════════════════════════
  # TRAINING PARAMETERS
  # ══════════════════════════════════════════════════════════════════════
  
  epochs: 50
  lr: 3e-4
  weight_decay: 0.01
  label_smoothing: 0.1
  
  # Use class-weighted loss (not weighted sampler to save memory)
  use_weighted_sampler: false
  
  # Early stopping
  early_stopping_patience: 7
  
  # ══════════════════════════════════════════════════════════════════════
  # DATA LOADING OPTIMIZATION
  # ══════════════════════════════════════════════════════════════════════
  
  # Reduce workers to save CPU→GPU memory transfers
  num_workers: 4  # Reduced from 8
  
  # Pin memory for faster GPU transfers (safe with 8GB VRAM)
  pin_memory: true
  
  # Enable persistent workers (faster epoch transitions)
  persistent_workers: true
  
  # ══════════════════════════════════════════════════════════════════════
  # POST-TRAINING
  # ══════════════════════════════════════════════════════════════════════
  
  run_calibration: true

# ══════════════════════════════════════════════════════════════════════
# ESTIMATED PERFORMANCE (RTX 5050 Laptop)
# ══════════════════════════════════════════════════════════════════════
#
# Training Time:
#   - Single dataset (4K cells): ~25-30 minutes
#   - Multi-dataset (151K cells): ~8-10 hours
#
# Memory Usage:
#   - Model: ~400 MB
#   - Batch (24 images): ~3.5 GB
#   - Gradients + Optimizer: ~2.5 GB
#   - CUDA overhead: ~1.5 GB
#   - Total: ~7.9 GB (fits in 8GB!)
#
# Throughput:
#   - ~5.2 images/second (with BF16 mixed precision)
#   - ~18,700 images/hour
#   - 151,000 images = ~8 hours
#
# Tips:
#   - Close other apps to free GPU memory
#   - Use laptop plugged in (don't run on battery)
#   - Ensure good cooling (use laptop stand/cooling pad)
#   - Monitor GPU temp: should stay < 85°C
#
# ══════════════════════════════════════════════════════════════════════
