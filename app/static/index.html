<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Phase 1 persistence verified -->
    <title>Bone Marrow Cytomorphology Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;background:#f5f7fa;color:#2d3748;line-height:1.6;}
        .app{display:flex;height:100vh;}

        /* ── Sidebar ── */
        .sidebar{width:200px;min-width:200px;background:#1a202c;color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .22s cubic-bezier(0.4,0,0.2,1),min-width .22s cubic-bezier(0.4,0,0.2,1),opacity .18s ease;position:relative;overflow-x:hidden;}
        .sidebar.collapsed{width:0 !important;min-width:0 !important;overflow:hidden !important;opacity:0 !important;pointer-events:none;}
        .sidebar-header{padding:1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,.1);min-width:200px;}
        .sidebar-header h1{font-size:1rem;font-weight:700;margin-bottom:.2rem;}
        .sidebar-header p{font-size:.75rem;color:#a0aec0;}
        .sidebar-nav{flex:1;padding:.5rem 0;min-width:200px;}
        .nav-item{padding:.65rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;font-size:.85rem;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;}
        .nav-item:hover{background:rgba(255,255,255,.06);}
        .nav-item.active{background:rgba(59,130,246,.18);border-left-color:#3b82f6;color:#fff;}
        .nav-item i{width:16px;text-align:center;font-size:.85rem;}

        /* ── Main ── */
        .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.85rem 1.5rem;}
        .topbar h2{font-size:1.3rem;font-weight:600;color:#1a202c;}
        .content-area{flex:1;display:flex;overflow:hidden;position:relative;}
        .content-main{flex:1;padding:1.5rem;overflow-y:auto;}
        .content-main.chat-view{padding:0;}
        .content-sidebar{width:280px;min-width:280px;background:#fff;border-left:1px solid #e2e8f0;overflow-y:auto;transition:width .22s cubic-bezier(0.4,0,0.2,1),min-width .22s cubic-bezier(0.4,0,0.2,1),border .18s ease;position:relative;}
        .content-sidebar.collapsed{width:0 !important;min-width:0 !important;border-left:none !important;overflow:hidden !important;pointer-events:none;}

        .sidebar-arrow-btn:hover{background:rgba(255,255,255,.2) !important;color:#fff !important;}
        .topbar-sidebar-toggle-btn:hover{background:#e2e8f0 !important;color:#1e293b !important;}
        .history-arrow-btn:hover{background:#e2e8f0 !important;color:#1e293b !important;}
        .sidebar-edge-tab{transition:all .18s ease;user-select:none;}
        .sidebar-edge-tab:hover{filter:brightness(1.08);transform:translateY(-50%) scale(1.05) !important;}

        /* ── Cards ── */
        .card{background:#fff;border-radius:8px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1.25rem;}
        .card-title{font-size:1rem;font-weight:600;margin-bottom:.85rem;color:#1a202c;}

        /* ── Metrics & Upload Tab Enhanced UI ── */
        .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.85rem;margin-bottom:1.25rem;}
        .metric-card{background:#fff;border-radius:10px;padding:1.1rem;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e2e8f0;position:relative;overflow:hidden;transition:transform .15s, box-shadow .15s;}
        .metric-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08);}
        .metric-card-accent{position:absolute;top:0;left:0;right:0;height:3px;}
        .metric-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem;}
        .metric-label{font-size:.78rem;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
        .metric-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
        .metric-value{font-size:1.75rem;font-weight:700;color:#0f172a;line-height:1.15;}

        /* Upload Zone */
        .upload-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e2e8f0;margin-bottom:1.5rem;}
        .upload-zone{border:2px dashed #cbd5e1;border-radius:10px;padding:2.25rem 1.5rem;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc;}
        .upload-zone:hover{border-color:#3b82f6;background:#eff6ff;}
        .upload-zone.dragging{border-color:#2563eb;background:#dbeafe;transform:scale(1.005);}
        .upload-zone-icon{width:56px;height:56px;border-radius:50%;background:#e0e7ff;color:#4f46e5;display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:.85rem;transition:transform .2s;}
        .upload-zone:hover .upload-zone-icon{transform:scale(1.08);}
        .upload-file-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:.85rem;}
        .upload-file-pill{font-size:.74rem;background:#fff;border:1px solid #cbd5e1;padding:3px 8px;border-radius:12px;color:#334155;display:inline-flex;align-items:center;gap:5px;}

        /* Multi-step progress bar during inference */
        .upload-stepper{background:#fff;border-radius:12px;padding:1.75rem;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:1.5rem;}
        .stepper-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1.25rem;}
        @media(max-width:768px){.stepper-steps{grid-template-columns:1fr;gap:.6rem;}}
        .stepper-step{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:.75rem .9rem;position:relative;display:flex;align-items:center;gap:.65rem;}
        .stepper-step.active{background:#eff6ff;border-color:#93c5fd;}
        .stepper-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}
        .stepper-step.active .stepper-dot{background:#3b82f6;color:#fff;}
        .stepper-step:not(.active) .stepper-dot{background:#e2e8f0;color:#64748b;}
        .stepper-title{font-size:.78rem;font-weight:600;color:#1e293b;line-height:1.2;}
        .stepper-sub{font-size:.68rem;color:#64748b;margin-top:2px;}

        /* Case Header Banner */
        .case-header-card{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;box-shadow:0 4px 12px rgba(15,23,42,.15);}
        .case-title-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
        .case-badge{font-family:monospace;font-weight:700;font-size:.95rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:6px;letter-spacing:.05em;}
        .case-actions-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
        .case-btn{font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:6px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
        .case-btn-primary{background:#3b82f6;color:#fff;}
        .case-btn-primary:hover{background:#2563eb;}
        .case-btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);}
        .case-btn-ghost:hover{background:rgba(255,255,255,.2);}

        /* Confidence Strip */
        .conf-strip{background:#fff;border-radius:8px;padding:.75rem 1rem;border:1px solid #e2e8f0;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
        .conf-bar-track{flex:1;min-width:140px;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;border:1px solid #e2e8f0;}
        .conf-bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}

        input[type="file"]{display:none;}

        /* ── Image tabs ── */
        .img-tabs{display:flex;gap:.25rem;margin-bottom:.85rem;border-bottom:2px solid #e2e8f0;}
        .img-tab{padding:.6rem 1rem;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;font-weight:500;color:#718096;font-size:.85rem;transition:all .15s;margin-bottom:-2px;}
        .img-tab.active{color:#3b82f6;border-bottom-color:#3b82f6;}
        .img-tab:hover{background:#f7fafc;}

        /* ── Table ── */
        table{width:100%;border-collapse:collapse;font-size:.875rem;}
        thead{background:#f7fafc;}
        th{text-align:left;padding:.65rem .75rem;font-weight:600;border-bottom:2px solid #e2e8f0;}
        td{padding:.65rem .75rem;border-bottom:1px solid #e2e8f0;}

        /* ── Chat ── */
        .chat-container{display:flex;flex-direction:column;height:100%;}
        .chat-messages{flex:1;overflow-y:auto;padding:1.5rem 0;}
        .chat-messages::-webkit-scrollbar{width:6px;}
        .chat-messages::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
        .msg-wrap{width:100%;display:flex;justify-content:center;padding:1rem;}
        .msg-wrap.user{background:#f7f7f8;}
        .msg-wrap.assistant{background:#fff;}
        .msg-inner{max-width:720px;width:100%;display:flex;gap:1rem;}
        .avatar{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:.8rem;}
        .avatar.user{background:#3b82f6;color:#fff;}
        .avatar.assistant{background:#10a37f;color:#fff;}
        .msg-text{flex:1;padding-top:.15rem;line-height:1.75;color:#374151;font-size:.9rem;}
        .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9ca3af;padding:2rem;text-align:center;}
        .chat-empty h3{color:#6b7280;margin-bottom:.5rem;}
        .chat-input-area{padding:1rem 1.5rem;border-top:1px solid #e5e7eb;background:#fff;}
        .chat-input-row{max-width:720px;margin:0 auto;position:relative;}
        .chat-input{width:100%;padding:.85rem 3rem .85rem 1rem;border:1px solid #d1d5db;border-radius:10px;resize:none;font-family:inherit;font-size:.9rem;line-height:1.5;}
        .chat-input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1);}
        .send-btn{position:absolute;right:.5rem;bottom:.5rem;width:30px;height:30px;border-radius:6px;border:none;background:#3b82f6;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
        .send-btn:hover:not(:disabled){background:#2563eb;}
        .send-btn:disabled{background:#d1d5db;cursor:not-allowed;}

        /* ── Enhanced Chat UI ── */
        .chat-header-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;border-bottom:1px solid #e2e8f0;background:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,.03);flex-wrap:wrap;gap:.5rem;}
        .chat-pill{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;}
        .chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:.5rem 1.25rem;background:#f8fafc;border-top:1px solid #e2e8f0;}
        .chat-chip{font-size:.76rem;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;padding:4px 10px;border-radius:16px;cursor:pointer;transition:all .15s;font-weight:500;}
        .chat-chip:hover{background:#dbeafe;border-color:#93c5fd;}
        .chat-source-tag{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-family:monospace;background:#f1f5f9;color:#0284c7;border:1px solid #cbd5e1;padding:2px 6px;border-radius:4px;margin-right:4px;margin-top:4px;}
        .typing-indicator{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#f1f5f9;border-radius:16px;color:#64748b;font-size:.78rem;}
        .typing-dot{width:5px;height:5px;background:#94a3b8;border-radius:50%;animation:pulseDot 1.4s infinite ease-in-out both;}
        .typing-dot:nth-child(1){animation-delay:-0.32s;}
        .typing-dot:nth-child(2){animation-delay:-0.16s;}
        @keyframes pulseDot{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}

        /* ── Report ── */
        .report-header{background:#fff;border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);}
        .report-header h1{font-size:1.5rem;font-weight:700;}
        .report-warning{background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:1rem;margin-bottom:1.25rem;color:#92400e;font-size:.875rem;}
        .report-section{background:#fff;border-radius:8px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #3b82f6;}
        .report-section h3{font-size:1.1rem;font-weight:600;margin-bottom:.85rem;color:#1a202c;}
        .report-text{line-height:1.8;color:#4a5568;font-size:.9rem;white-space:pre-wrap;}
        .report-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.75rem;margin-top:1rem;}
        .report-imgs img{width:100%;height:110px;object-fit:cover;border-radius:6px;border:1px solid #e2e8f0;}

        /* ── Cell Explorer ── */
        .cell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.85rem;}
        .cell-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.65rem;text-align:center;}
        .cell-card img{width:100%;height:110px;object-fit:cover;border-radius:4px;margin-bottom:.4rem;border:1px solid #e2e8f0;}
        .cell-img-placeholder{width:100%;height:110px;background:#f0f0f0;border-radius:4px;margin-bottom:.4rem;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:.75rem;}
        .cell-name{font-weight:600;font-size:.8rem;color:#1a202c;margin-bottom:.15rem;}
        .cell-desc{font-size:.7rem;color:#718096;}
        .cell-conf{font-size:.7rem;color:#3b82f6;font-weight:600;margin-top:.2rem;}

        /* ── Phase 10: Clinical Disease Detection & Multi-Databank Evidence ── */
        .med-diff-card{background:#ffffff;border:1px solid #cbd5e1;border-radius:10px;padding:1.25rem;margin-bottom:1.5rem;box-shadow:0 2px 6px rgba(0,0,0,.04);}
        .med-diff-title{font-size:1.05rem;font-weight:700;color:#0f172a;display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;border-bottom:2px solid #e2e8f0;padding-bottom:.5rem;}
        .med-cand-box{background:#f8fafc;border-left:4px solid #3b82f6;border-radius:6px;padding:.85rem 1rem;margin-bottom:1rem;border-top:1px solid #e2e8f0;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;}
        .med-cand-box.high{border-left-color:#ef4444;background:#fffaf0;}
        .med-cand-box.moderate{border-left-color:#f59e0b;background:#fefce8;}
        .med-cand-box.skew{border-left-color:#8b5cf6;background:#faf5ff;}
        .med-cand-box.baseline{border-left-color:#10b981;background:#f0fdf4;}
        .med-cand-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem;}
        .med-cand-name{font-weight:700;font-size:.95rem;color:#1e293b;}
        .med-badge{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.4px;}
        .med-badge.high{background:#fee2e2;color:#991b1b;border:1px solid #f87171;}
        .med-badge.moderate{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
        .med-badge.skew{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;}
        .med-badge.baseline{background:#dcfce7;color:#166534;border:1px solid #86efac;}
        .med-cand-criteria{margin-top:.4rem;font-size:.825rem;color:#334155;line-height:1.5;}
        .med-cand-criteria ul{margin-left:1.2rem;margin-top:.2rem;}
        .med-biomarkers{display:flex;flex-wrap:wrap;gap:4px;margin-top:.5rem;align-items:center;}
        .med-bio-tag{font-size:.7rem;font-family:monospace;background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:4px;font-weight:600;}
        .med-tests-box{margin-top:.6rem;background:#ffffff;border:1px dashed #cbd5e1;padding:.6rem .8rem;border-radius:6px;font-size:.78rem;color:#475569;}
        .med-databanks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.85rem;margin-top:1rem;}
        .med-bank-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:.85rem;box-shadow:0 1px 3px rgba(0,0,0,.03);}
        .med-bank-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;font-size:.8rem;font-weight:700;color:#1e293b;}
        .med-bank-item{padding:.5rem;background:#f8fafc;border-radius:5px;margin-bottom:.4rem;font-size:.76rem;border-left:3px solid #3b82f6;}
        .med-bank-link{color:#2563eb;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-top:3px;}
        .med-bank-link:hover{text-decoration:underline;}

        /* ── History ── */
        .hist-item{padding:.85rem;border-bottom:1px solid #e2e8f0;cursor:pointer;transition:all .15s;position:relative;}
        .hist-item:hover{background:#f7fafc;}
        .hist-item.active{background:#eff6ff;border-left:3px solid #3b82f6;}
        .hist-item img{width:100%;height:90px;object-fit:cover;border-radius:4px;margin-bottom:.4rem;}
        .hist-title{font-weight:600;font-size:.8rem;color:#1a202c;margin-bottom:.2rem;}
        .hist-meta{font-size:.72rem;color:#718096;}
        .hist-time{font-size:.68rem;color:#a0aec0;margin-top:.15rem;}
        .del-btn{position:absolute;top:.5rem;right:.5rem;width:22px;height:22px;background:#ef4444;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:.65rem;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;}
        .hist-item:hover .del-btn{opacity:1;}

        /* ── Util ── */
        .loading{text-align:center;padding:3rem;color:#3b82f6;}
        .loading i{font-size:2.5rem;animation:spin 1s linear infinite;margin-bottom:.75rem;}
        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        .empty-state{text-align:center;padding:3rem;color:#9ca3af;}
        .empty-state i{font-size:3rem;margin-bottom:1rem;opacity:.4;}
        .error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:1rem;color:#dc2626;font-size:.875rem;}

        /* ── Heatmap & XAI ── */
        .regen-btn{background:#3b82f6;color:#fff;border:none;padding:.45rem 1rem;border-radius:6px;font-size:.8rem;cursor:pointer;font-weight:500;transition:all .15s;}
        .regen-btn:hover{background:#2563eb;box-shadow:0 2px 8px rgba(59,130,246,.3);}
        .xai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;margin-top:.75rem;}
        .xai-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s;}
        .xai-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08);border-color:#cbd5e1;}
        .xai-card img{width:100%;display:block;background:#f8fafc;}
        .xai-card-caption{padding:.75rem .9rem;font-size:.78rem;color:#334155;background:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;line-height:1.45;}
        .xai-card-caption .cell-tag{color:#2563eb;font-weight:700;display:inline-block;margin-right:4px;}
        .xai-card-caption .pred-tag{color:#0f172a;font-weight:600;}
        .xai-card-caption .conf-tag{color:#64748b;font-weight:500;}
        .callout-box{margin-top:1rem;padding:.85rem 1rem;border-radius:6px;background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;color:#92400e;font-size:.82rem;line-height:1.55;}
        .chart-box{background:#f8fafc;border-radius:8px;padding:1.25rem 1rem .75rem 1rem;border:1px solid #e2e8f0;}

        /* ── Phase 9 – Depth switcher & reading mode ── */
        .p9-toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;}
        .p9-depth-btn{padding:.3rem .75rem;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:.78rem;cursor:pointer;color:#4a5568;transition:all .15s;}
        .p9-depth-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6;font-weight:600;}
        .p9-toggle{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:#4a5568;cursor:pointer;padding:.3rem .75rem;border-radius:20px;border:1px solid #e2e8f0;background:#fff;transition:all .15s;}
        .p9-toggle.on{background:#ede9fe;border-color:#a78bfa;color:#5b21b6;}
        .p9-sep{color:#d1d5db;font-size:.9rem;}

        /* ── Phase 9 – Report layout with TOC ── */
        .p9-report-wrap{display:flex;gap:1.25rem;align-items:flex-start;}
        .p9-toc{width:180px;min-width:160px;position:sticky;top:0;background:#fff;border-radius:8px;padding:.85rem;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-shrink:0;}
        .p9-toc-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin-bottom:.5rem;}
        .p9-toc-item{display:block;padding:.3rem .5rem;font-size:.75rem;color:#6b7280;border-radius:4px;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;transition:all .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .p9-toc-item:hover{background:#f3f4f6;color:#374151;}
        .p9-toc-item.p9-toc-active{background:#eff6ff;color:#2563eb;font-weight:600;}
        .p9-sections{flex:1;min-width:0;}

        /* ── Phase 9 – Claim spans ── */
        .p9-claim{cursor:pointer;border-radius:3px;padding:1px 2px;transition:background .15s;}
        .p9-claim:hover,.p9-claim.p9-hover{background:rgba(59,130,246,.12);}
        .p9-claim.p9-active{background:rgba(59,130,246,.22);outline:1px solid #3b82f6;}
        .p9-claim[data-unsupported="true"]{opacity:.75;}
        /* Highlight mode: guided evidence colouring by type */
        .p9-hl .p9-claim[data-type="observation"]{background:rgba(16,185,129,.1);}
        .p9-hl .p9-claim[data-type="guideline"]{background:rgba(245,158,11,.12);}
        .p9-hl .p9-claim[data-type="limitation"]{background:rgba(239,68,68,.1);}
        .p9-hl .p9-claim[data-type="followup"]{background:rgba(99,102,241,.12);}

        /* ── Phase 9 – Claim mini tooltip ── */
        .p9-tooltip{position:fixed;z-index:9000;background:#1e293b;color:#f1f5f9;border-radius:8px;padding:.6rem .85rem;font-size:.77rem;pointer-events:none;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.25);line-height:1.5;}
        .p9-tooltip-type{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:.25rem;}
        .p9-tooltip-type.observation{color:#34d399;}
        .p9-tooltip-type.guideline{color:#fbbf24;}
        .p9-tooltip-type.limitation{color:#f87171;}
        .p9-tooltip-type.followup{color:#818cf8;}
        .p9-unsup-badge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:3px;padding:1px 4px;font-size:.65rem;font-weight:600;margin-left:.3rem;}

        /* ── Phase 9 – Evidence Inspector drawer ── */
        .p9-inspector{position:fixed;top:0;right:0;bottom:0;width:420px;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);z-index:8000;display:flex;flex-direction:column;animation:slideInRight .18s ease;}
        @keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
        .p9-insp-head{padding:1rem 1.25rem .75rem;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;}
        .p9-insp-head-text{flex:1;min-width:0;}
        .p9-insp-claim-text{font-size:.85rem;color:#1e293b;line-height:1.5;margin-bottom:.35rem;font-style:italic;}
        .p9-insp-close{background:transparent;border:none;font-size:1.1rem;cursor:pointer;color:#9ca3af;padding:.2rem;flex-shrink:0;}
        .p9-insp-close:hover{color:#374151;}
        .p9-insp-tabs{display:flex;border-bottom:1px solid #e2e8f0;padding:0 1.25rem;}
        .p9-insp-tab{padding:.6rem .9rem;font-size:.8rem;cursor:pointer;border-bottom:2px solid transparent;color:#6b7280;font-weight:500;transition:all .15s;}
        .p9-insp-tab.active{color:#2563eb;border-bottom-color:#2563eb;}
        .p9-insp-body{flex:1;overflow-y:auto;padding:1.25rem;}

        /* Numbers tab */
        .p9-metric-row{display:flex;justify-content:space-between;align-items:baseline;padding:.5rem 0;border-bottom:1px solid #f1f5f9;font-size:.82rem;}
        .p9-metric-key{color:#6b7280;font-weight:500;}
        .p9-metric-val{color:#1e293b;font-weight:700;}
        .p9-formula{font-size:.74rem;color:#9ca3af;margin-top:.2rem;font-style:italic;}

        /* Cells tab */
        .p9-cell-strip{display:flex;flex-wrap:wrap;gap:.5rem;}
        .p9-cell-thumb{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:.35rem;text-align:center;width:88px;cursor:pointer;transition:border-color .15s;}
        .p9-cell-thumb:hover{border-color:#3b82f6;}
        .p9-cell-thumb img{width:72px;height:72px;object-fit:cover;border-radius:4px;}
        .p9-cell-thumb-label{font-size:.62rem;color:#374151;margin-top:.25rem;line-height:1.3;}

        /* Guidelines tab */
        .p9-chunk{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:.85rem;margin-bottom:.85rem;font-size:.8rem;}
        .p9-chunk-id{font-size:.65rem;color:#9ca3af;font-weight:600;margin-bottom:.3rem;font-family:monospace;}
        .p9-chunk-text{color:#374151;line-height:1.6;}
        .p9-no-data{text-align:center;color:#9ca3af;padding:2rem;font-size:.82rem;}

        /* Verification tab */
        .p9-status-pill{display:inline-block;padding:.25rem .7rem;border-radius:20px;font-size:.72rem;font-weight:600;}
        .p9-status-pill.grounded{background:#d1fae5;color:#065f46;}
        .p9-status-pill.ungrounded{background:#fee2e2;color:#991b1b;}
        .p9-status-pill.numeric_mismatch{background:#fef3c7;color:#92400e;}
        .p9-status-pill.not_individually_checked{background:#f3f4f6;color:#6b7280;}

        /* Highlight legend */
        .p9-hl-legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-left:auto;}
        .p9-hl-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px;}
    
        /* ── Phase 10 – Depth Tier Blocks ── */
        .p10-reading-time{font-size:.73rem;color:#64748b;display:inline-flex;align-items:center;gap:.3rem;margin-left:.5rem;background:#f1f5f9;padding:.2rem .55rem;border-radius:12px;}
        .p10-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-bottom:1.25rem;}
        .p10-kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.85rem;box-shadow:0 1px 3px rgba(0,0,0,.04);}
        .p10-kpi-label{font-size:.72rem;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
        .p10-kpi-val{font-size:1.4rem;font-weight:700;color:#1e293b;margin-top:.2rem;}
        .p10-kpi-sub{font-size:.72rem;color:#94a3b8;margin-top:.15rem;}

        .p10-flags-card{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:1rem;margin-bottom:1.25rem;}
        .p10-flag-item{display:flex;gap:.6rem;align-items:flex-start;margin-top:.5rem;font-size:.82rem;color:#78350f;}
        .p10-flag-icon{color:#d97706;font-size:.9rem;margin-top:.15rem;}

        .p10-evidence-badge{display:inline-block;padding:.25rem .65rem;border-radius:20px;font-size:.72rem;font-weight:600;margin-left:.6rem;}
        .p10-evidence-badge.low{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
        .p10-evidence-badge.adequate{background:#dcfce7;color:#166534;border:1px solid #86efac;}

        .p10-signoff-bar{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
        .p10-signoff-btn{padding:.5rem 1.1rem;background:#2563eb;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;}
        .p10-signoff-btn:hover{background:#1d4ed8;}

        .p10-fig-container{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-bottom:1.25rem;}
        .p10-fig-img{width:100%;max-height:420px;object-fit:contain;border-radius:6px;background:#0f172a;}
        .p10-fig-caption{font-size:.76rem;color:#64748b;margin-top:.5rem;font-style:italic;}

        .p10-class-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-bottom:1rem;transition:box-shadow .15s;}
        .p10-class-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.06);}
        .p10-class-strip{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
        .p10-class-crop{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid #e2e8f0;}

        .p10-chapter{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1.25rem;margin-bottom:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.04);}
        .p10-ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.85rem;}
        .p10-ch-box{background:#f8fafc;border:1px solid #f1f5f9;border-radius:6px;padding:.75rem;}
        .p10-ch-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:.3rem;}
        .p10-ch-text{font-size:.8rem;color:#334155;line-height:1.5;}

        /* ── Phase 10 Step 9 – Polish, Diagrams, Figures, Lightbox & PDF ── */
        .p10-diagram-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;}
        @media (max-width:900px){.p10-diagram-grid{grid-template-columns:1fr;}}
        .p10-diagram-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04);}
        .p10-diagram-head{font-size:.82rem;font-weight:700;color:#1e293b;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center;}
        .p10-diagram-img{width:100%;height:auto;border-radius:4px;cursor:pointer;transition:transform .15s;}
        .p10-diagram-img:hover{transform:scale(1.01);}

        /* Literature Reference Chips */
        .p10-lit-chip{display:inline-flex;align-items:center;background:#f8fafc;border:1px solid #cbd5e1;color:#475569;border-radius:12px;padding:1px 7px;font-size:.68rem;font-weight:600;margin-left:4px;cursor:pointer;vertical-align:middle;transition:all .15s;}
        .p10-lit-chip:hover{background:#ede9fe;border-color:#a78bfa;color:#6b21a8;}
        
        /* Lightbox modal */
        .p10-lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:2rem;}
        .p10-lightbox-content{background:#fff;border-radius:8px;max-width:90vw;max-height:90vh;overflow:auto;padding:1.5rem;position:relative;box-shadow:0 20px 40px rgba(0,0,0,.35);}
        .p10-lightbox-img{max-width:100%;max-height:75vh;object-fit:contain;display:block;margin:0 auto;border-radius:4px;}
        .p10-lightbox-close{position:absolute;top:1rem;right:1rem;background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#475569;}
        .p10-lightbox-close:hover{background:#e2e8f0;color:#0f172a;}

        /* Literature popover */
        .p10-lit-popover{position:fixed;z-index:9100;background:#1e293b;color:#f8fafc;border-radius:8px;padding:.85rem 1rem;font-size:.78rem;max-width:340px;box-shadow:0 10px 25px rgba(0,0,0,.3);line-height:1.5;}
        .p10-lit-pop-head{font-size:.7rem;font-weight:700;color:#c084fc;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem;}
        .p10-lit-pop-src{font-size:.72rem;color:#94a3b8;margin-bottom:.4rem;font-style:italic;}

        /* Print / PDF Styles */
        .p10-print-btn{padding:.4rem .85rem;background:#fff;border:1px solid #cbd5e0;border-radius:6px;font-size:.78rem;font-weight:600;color:#334155;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;transition:all .15s;}
        .p10-print-btn:hover{background:#f1f5f9;border-color:#94a3b8;}
        .p10-disclaimer-footer{background:#f8fafc;border-top:1px solid #e2e8f0;padding:1.25rem;margin-top:2rem;font-size:.72rem;color:#64748b;line-height:1.6;border-radius:6px;}

        @media print{
          .sidebar, .topbar, .content-sidebar, .p9-toolbar, .p9-toc, .regen-btn, .p10-print-btn, .p10-signoff-btn{display:none !important;}
          .app{display:block !important;height:auto !important;}
          .main-content, .content-area, .content-main{overflow:visible !important;padding:0 !important;display:block !important;}
          .p9-report-wrap{display:block !important;}
          .p9-sections{width:100% !important;}
          .p10-diagram-grid{grid-template-columns:1fr 1fr !important;page-break-inside:avoid;}
          .p10-fig-container{page-break-inside:avoid;}
          .p10-chapter{page-break-inside:avoid;}
        }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══════════════════════════════════════════════════════════ helpers */
async function apiFetch(url, opts = {}) {
    const res = await fetch(url, opts);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
}

function safeConf(v) {
    const n = parseFloat(v);
    return isNaN(n) || !isFinite(n) ? 0 : n;
}

const CELL_DESC = {
    "Blast":                   "Immature precursor cell",
    "Lymphoid Series":         "Mature lymphocyte",
    "Granulocyte (Mature)":    "Mature neutrophil",
    "Granulocyte (Mature/Band)":"Band neutrophil",
    "Granulocyte (Immature)":  "Early myeloid cell",
    "Erythroid Precursor":     "RBC precursor",
    "Monocyte":                "Large phagocyte",
    "Monocyte Series":         "Monocytic lineage",
    "Megakaryocyte/Platelet":  "Platelet producer",
    "Promyelocyte":            "Early myeloid stage",
    "Myeloid (Maturing)":      "Maturing myeloid cell",
    "Promonocyte":             "Monocyte precursor",
};

/* ═══════════════════════════════════════════════════════════ App */
function App() {
    const [tab, setTab]           = useState('upload');
    const [analyses, setAnalyses] = useState([]);
    const [selId, setSelId]       = useState(null);
    const [uploading, setUploading] = useState(false);
    const [showAgentFeed, setShowAgentFeed] = useState(false);
    const [agentEventCount, setAgentEventCount] = useState(0);

    // Collapsible sidebars state with persistence
    const [leftSidebarOpen, setLeftSidebarOpen] = useState(() => {
        try { return localStorage.getItem('bm_left_sidebar') !== 'false'; } catch (e) { return true; }
    });
    const [rightSidebarOpen, setRightSidebarOpen] = useState(() => {
        try { return localStorage.getItem('bm_right_sidebar') !== 'false'; } catch (e) { return true; }
    });

    useEffect(() => {
        try { localStorage.setItem('bm_left_sidebar', leftSidebarOpen); } catch (e) {}
    }, [leftSidebarOpen]);

    useEffect(() => {
        try { localStorage.setItem('bm_right_sidebar', rightSidebarOpen); } catch (e) {}
    }, [rightSidebarOpen]);

    useEffect(() => { fetchList(); }, []);

    async function fetchList() {
        try {
            let d;
            try {
                d = await apiFetch('/api/history');
            } catch (err) {
                d = await apiFetch('/api/analyses');
            }
            const list = d.analyses || d.cases || [];
            setAnalyses(list);
            // auto-select most-recent
            if (list.length > 0 && !selId) setSelId(list[list.length - 1].id);
        } catch {}
    }

    async function handleUpload(files) {
        setUploading(true);
        const fd = new FormData();
        Array.from(files).forEach(f => fd.append('files', f));
        try {
            const d = await apiFetch('/api/upload', { method: 'POST', body: fd });
            if (d.success) {
                await fetchList();
                setSelId(d.analysis_id);
                setTab('upload');
            }
        } catch (e) {
            alert('Upload failed: ' + e.message);
        } finally {
            setUploading(false);
        }
    }

    async function handleDelete(id, e) {
        e.stopPropagation();
        if (!confirm('Delete this analysis?')) return;
        try {
            await apiFetch(`/api/analysis/${id}`, { method: 'DELETE' });
            await fetchList();
            if (selId === id) setSelId(null);
        } catch {}
    }

    return (
        <div className="app">
            <Sidebar
                tab={tab}
                setTab={setTab}
                collapsed={!leftSidebarOpen}
                onToggle={() => setLeftSidebarOpen(prev => !prev)}
            />
            <div className="main-content">
                <Topbar
                    tab={tab}
                    showAgentFeed={showAgentFeed}
                    setShowAgentFeed={setShowAgentFeed}
                    agentEventCount={agentEventCount}
                    leftSidebarOpen={leftSidebarOpen}
                    setLeftSidebarOpen={setLeftSidebarOpen}
                    rightSidebarOpen={rightSidebarOpen}
                    setRightSidebarOpen={setRightSidebarOpen}
                />
                <div className="content-area">
                    {/* Left edge tab to reopen left sidebar when closed */}
                    {!leftSidebarOpen && (
                        <button
                            className="sidebar-edge-tab left"
                            onClick={() => setLeftSidebarOpen(true)}
                            title="Open navigation sidebar (click to expand)"
                            style={{
                                position: 'absolute',
                                left: 0,
                                top: '50%',
                                transform: 'translateY(-50%)',
                                zIndex: 30,
                                background: '#1a202c',
                                border: '1px solid rgba(255,255,255,0.25)',
                                borderLeft: 'none',
                                borderRadius: '0 8px 8px 0',
                                padding: '12px 6px',
                                cursor: 'pointer',
                                boxShadow: '2px 0 8px rgba(0,0,0,0.2)',
                                color: '#ffffff',
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                gap: '5px'
                            }}
                        >
                            <i className="fas fa-chevron-right" style={{fontSize:'.82rem'}}></i>
                            <span style={{writingMode:'vertical-rl',fontSize:'.7rem',fontWeight:600,letterSpacing:'.5px',color:'#cbd5e1'}}>Nav</span>
                        </button>
                    )}

                    <div className={`content-main ${tab === 'chat' ? 'chat-view' : ''}`}>
                        {tab === 'upload'  && <UploadTab  selId={selId} onUpload={handleUpload} uploading={uploading} onNavigateTab={setTab} />}
                        {tab === 'chat'    && <ChatTab    selId={selId} />}
                        {tab === 'report'  && <ReportTab  selId={selId} />}
                        {tab === 'cells'   && <CellsTab   selId={selId} onRefreshHistory={fetchList} />}
                    </div>

                    <div className={`content-sidebar ${!rightSidebarOpen ? 'collapsed' : ''}`}>
                        <History
                            analyses={analyses}
                            selId={selId}
                            onSelect={setSelId}
                            onDelete={handleDelete}
                            onToggle={() => setRightSidebarOpen(false)}
                        />
                    </div>

                    {/* Right edge tab to reopen right sidebar when closed */}
                    {!rightSidebarOpen && (
                        <button
                            className="sidebar-edge-tab right"
                            onClick={() => setRightSidebarOpen(true)}
                            title="Open Analysis History (click to expand)"
                            style={{
                                position: 'absolute',
                                right: 0,
                                top: '50%',
                                transform: 'translateY(-50%)',
                                zIndex: 30,
                                background: '#ffffff',
                                border: '1px solid #cbd5e1',
                                borderRight: 'none',
                                borderRadius: '8px 0 0 8px',
                                padding: '12px 6px',
                                cursor: 'pointer',
                                boxShadow: '-2px 0 8px rgba(0,0,0,0.1)',
                                color: '#2563eb',
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                gap: '5px'
                            }}
                        >
                            <i className="fas fa-chevron-left" style={{fontSize:'.82rem'}}></i>
                            <span style={{writingMode:'vertical-rl',fontSize:'.7rem',fontWeight:600,letterSpacing:'.5px',color:'#475569'}}>History</span>
                        </button>
                    )}
                </div>
                <AgentActivityPanel selId={selId} open={showAgentFeed} onClose={() => setShowAgentFeed(false)} onCountUpdate={setAgentEventCount} />
            </div>
        </div>
    );
}

/* ── Sidebar ── */
function Sidebar({ tab, setTab, collapsed, onToggle }) {
    const items = [
        { id: 'upload', icon: 'fa-upload',      label: 'Upload & Analyze' },
        { id: 'chat',   icon: 'fa-comments',     label: 'Ask Questions'   },
        { id: 'report', icon: 'fa-file-medical', label: 'RAG Report'      },
        { id: 'cells',  icon: 'fa-microscope',   label: 'Cell Explorer'   },
    ];
    return (
        <div className={`sidebar ${collapsed ? 'collapsed' : ''}`}>
            <div className="sidebar-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{overflow:'hidden'}}>
                    <h1><i className="fas fa-microscope" style={{marginRight:'8px',color:'#60a5fa'}}></i>Bone Marrow Analysis</h1>
                    <p>Cytomorphology Assistant</p>
                </div>
                {onToggle && (
                    <button
                        type="button"
                        onClick={onToggle}
                        className="sidebar-arrow-btn"
                        title="Close navigation sidebar"
                        style={{
                            background: 'rgba(255,255,255,0.08)',
                            border: '1px solid rgba(255,255,255,0.15)',
                            borderRadius: '6px',
                            color: '#cbd5e1',
                            width: '26px',
                            height: '26px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            cursor: 'pointer',
                            padding: 0,
                            marginLeft: '4px',
                            flexShrink: 0,
                            transition: 'all .15s'
                        }}
                    >
                        <i className="fas fa-chevron-left" style={{fontSize:'.75rem'}}></i>
                    </button>
                )}
            </div>
            <div className="sidebar-nav">
                {items.map(it => (
                    <div key={it.id} className={`nav-item ${tab === it.id ? 'active' : ''}`} onClick={() => setTab(it.id)}>
                        <i className={`fas ${it.icon}`}></i> {it.label}
                    </div>
                ))}
            </div>
        </div>
    );
}

/* ── Topbar ── */
function Topbar({
    tab,
    showAgentFeed,
    setShowAgentFeed,
    agentEventCount,
    leftSidebarOpen,
    setLeftSidebarOpen,
    rightSidebarOpen,
    setRightSidebarOpen
}) {
    const titles = { upload: 'Upload & Analyze Images', chat: 'Ask Questions', report: 'Comprehensive RAG Report', cells: 'Cell Explorer' };
    return (

/* ── AgentActivityPanel (collapsible live feed) ── */
function AgentActivityPanel({ selId, open, onClose, onCountUpdate }) {
    const [events, setEvents] = useState([]);

    useEffect(() => {
        let isMounted = true;
        async function fetchEvents() {
            try {
                const url = selId ? `/api/agent-events/${selId}` : '/api/agent-events';
                const d = await apiFetch(url);
                if (isMounted) {
                    const evs = d.events || [];
                    setEvents(evs);
                    if (onCountUpdate) onCountUpdate(evs.length);
                }
            } catch (e) {}
        }
        fetchEvents();
        const interval = setInterval(fetchEvents, 3000);
        return () => { isMounted = false; clearInterval(interval); };
    }, [selId]);

    if (!open) return null;

    return (
        <div style={{
            position: 'fixed',
            top: '60px',
            right: 0,
            bottom: 0,
            width: '350px',
            backgroundColor: '#ffffff',
            boxShadow: '-4px 0 20px rgba(0,0,0,0.12)',
            borderLeft: '1px solid #cbd5e1',
            zIndex: 1000,
            display: 'flex',
            flexDirection: 'column',
        }}>
            <div style={{
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                padding: '.85rem 1rem',
                borderBottom: '1px solid #e2e8f0',
                backgroundColor: '#f8fafc',
            }}>
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <i className="fas fa-robot" style={{color:'#3b82f6',fontSize:'1.1rem'}}></i>
                    <h3 style={{margin:0,fontSize:'.95rem',fontWeight:700,color:'#1e293b'}}>Agent Activity Feed</h3>
                </div>
                <button
                    onClick={onClose}
                    style={{background:'none',border:'none',fontSize:'1.2rem',color:'#64748b',cursor:'pointer',lineHeight:1}}
                    title="Close"
                >×</button>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'1rem',display:'flex',flexDirection:'column',gap:'10px'}}>
                {events.length === 0 ? (
                    <div style={{textAlign:'center',padding:'2rem',color:'#94a3b8',fontSize:'.825rem'}}>
                        No agent activity recorded yet. Run a triage review or query to observe live steps.
                    </div>
                ) : (
                    events.map((ev, i) => (
                        <div key={ev.id || i} style={{
                            padding: '8px 10px',
                            borderRadius: '6px',
                            backgroundColor: '#f8fafc',
                            border: '1px solid #e2e8f0',
                            fontSize: '.78rem',
                            display: 'flex',
                            flexDirection: 'column',
                            gap: '4px',
                        }}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                <span style={{fontWeight:700,color:'#2563eb'}}>{ev.agent || 'Agent'}</span>
                                <span style={{fontSize:'.68rem',color:'#94a3b8'}}>
                                    {ev.timestamp ? new Date(ev.timestamp).toLocaleTimeString() : ''}
                                </span>
                            </div>
                            <div style={{color:'#334155',fontFamily:'monospace',fontSize:'.74rem',wordBreak:'break-word'}}>
                                <strong>{ev.agent}</strong> → {ev.tool} → <span style={{color: ev.status === 'error' ? '#dc2626' : '#059669'}}>{ev.output_summary}</span>
                            </div>
                        </div>
                    ))
                )}
            </div>
        </div>

}

/* ── CellMorphologySection ── */
function CellMorphologySection({ analysis }) {
    if (!analysis || !analysis.morphology || analysis.morphology.length === 0) return null;

    const filtered = analysis.morphology.filter(m => m.count > 0);
    const dominant = (analysis.predominant_categories && analysis.predominant_categories[0]) || filtered[0]?.type || '—';
    const dominantItem = filtered.find(m => m.type === dominant) || filtered[0];
    const dominantCount = dominantItem ? dominantItem.count : 0;
    const maxCount = Math.max(...filtered.map(m => m.count), 4);
    const blastPct = ((analysis.metrics?.blast_fraction ?? 0) * 100).toFixed(1);

    const yTicks = [];
    for (let i = maxCount; i >= 0; i--) {
        yTicks.push(i);
    }

    return (
        <div className="card" style={{marginTop:'1.5rem'}}>
            <h3 style={{fontSize:'1.15rem',fontWeight:700,color:'#1e293b',marginBottom:'.25rem'}}>Cell Morphology</h3>
            <p style={{fontSize:'.8rem',color:'#64748b',marginBottom:'1.25rem'}}>
                Based on {analysis.metrics?.cells_classified ?? analysis.metrics?.cells_detected ?? 0} individually detected and classified cells across {analysis.metrics?.images_processed ?? 1} image(s). Detected-cell proportion — does not replace a clinical 500-cell aspirate differential.
            </p>

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(320px, 1fr))',gap:'1.5rem',alignItems:'start'}}>
                {/* Left: Table + Callout */}
                <div>
                    <table style={{width:'100%',borderCollapse:'collapse'}}>
                        <thead>
                            <tr style={{borderBottom:'1px solid #e2e8f0',fontSize:'.78rem',color:'#64748b',textTransform:'uppercase',letterSpacing:'.05em'}}>
                                <th style={{textAlign:'left',padding:'.5rem .75rem'}}>Morphology</th>
                                <th style={{textAlign:'right',padding:'.5rem .75rem'}}>Cells</th>
                                <th style={{textAlign:'right',padding:'.5rem .75rem'}}>Percentage</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filtered.map(m => (
                                <tr key={m.type} style={{borderBottom:'1px solid #f1f5f9',fontSize:'.82rem'}}>
                                    <td style={{padding:'.55rem .75rem',fontWeight:600,color:'#334155'}}>{m.type}</td>
                                    <td style={{padding:'.55rem .75rem',textAlign:'right',fontWeight:700,color:'#0f172a'}}>{m.count}</td>
                                    <td style={{padding:'.55rem .75rem',textAlign:'right',color:'#475569'}}>{(m.percentage * 100).toFixed(1)}%</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

                    <div className="callout-box">
                        {analysis.is_low_evidence ? (
                            <>
                                <div><strong style={{color:'#78350f'}}>Observed distribution:</strong> {dominant} ({dominantCount} cells).</div>
                                <div style={{color:'#b45309',marginTop:'2px'}}>Insufficient visual evidence for population-level conclusions.</div>
                            </>
                        ) : (
                            <>
                                <div><strong style={{color:'#1e40af'}}>Predominant observed morphology:</strong> {dominant}</div>
                                <div><strong>Detected-cell blast proportion:</strong> {blastPct}%</div>
                                <div style={{fontSize:'.74rem',color:'#64748b',fontStyle:'italic',marginTop:'2px'}}>
                                    (Calculated exclusively from detected cells in this image — not a clinical blast %)
                                </div>
                            </>
                        )}
                    </div>
                </div>

                {/* Right: Horizontal Bar Chart with full names */}
                <div className="chart-box" style={{display:'flex',flexDirection:'column',gap:'8px',justifyContent:'center',minHeight:'190px'}}>
                    {filtered.map(m => {
                        const pctVal = ((m.percentage ?? (m.count / (analysis.metrics?.cells_detected || 1))) * 100).toFixed(1);
                        const widthPct = Math.max(3, (m.count / maxCount) * 100);
                        return (
                            <div key={m.type} style={{display:'flex',alignItems:'center',gap:'10px',fontSize:'.78rem'}}>
                                <div style={{width:'150px',textAlign:'right',fontWeight:600,color:'#334155',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={m.type}>
                                    {m.type}
                                </div>
                                <div style={{flex:1,height:'18px',backgroundColor:'#f1f5f9',borderRadius:'4px',overflow:'hidden',position:'relative',border:'1px solid #e2e8f0'}}>
                                    <div style={{
                                        width:`${widthPct}%`,
                                        height:'100%',
                                        background:'linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%)',
                                        borderRadius:'3px',
                                        transition:'width .4s ease',
                                    }} />
                                </div>
                                <div style={{width:'72px',color:'#64748b',fontWeight:600,textAlign:'left'}}>
                                    {m.count} ({pctVal}%)
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
}

/* ── UploadTab (Enhanced Clinical Cytomorphology Intake & Analysis Viewer) ── */
function UploadTab({ selId, onUpload, uploading, onNavigateTab }) {
    const [analysis, setAnalysis] = useState(null);
    const [imgView,  setImgView]  = useState('filtered');
    const [hideLowCellNotice, setHideLowCellNotice] = useState(false);
    const [dragOver, setDragOver] = useState(false);
    const [selectedFiles, setSelectedFiles] = useState([]);
    const [copiedId, setCopiedId] = useState(false);
    const fileRef = useRef();

    useEffect(() => {
        if (!selId) { setAnalysis(null); return; }
        setHideLowCellNotice(false);
        apiFetch(`/api/case/${selId}`)
            .then(setAnalysis)
            .catch(() => apiFetch(`/api/analysis/${selId}`).then(setAnalysis).catch(() => setAnalysis(null)));
    }, [selId]);

    function onFileSelect(e) {
        const files = Array.from(e.target.files || []);
        if (files.length) {
            setSelectedFiles(files);
            onUpload(files);
        }
        e.target.value = '';
    }

    function onDrop(e) {
        e.preventDefault();
        setDragOver(false);
        if (uploading) return;
        const files = Array.from(e.dataTransfer.files || []);
        if (files.length) {
            setSelectedFiles(files);
            onUpload(files);
        }
    }

    function copyCaseId(id) {
        if (!id) return;
        navigator.clipboard?.writeText(id);
        setCopiedId(true);
        setTimeout(() => setCopiedId(false), 2000);
    }

    const imgKey = imgView === 'raw' ? 'raw' : imgView === 'contact' ? 'contact' : 'filtered';
    const imgPath = analysis?.detection_images?.[imgKey];
    const blastFraction = analysis?.metrics?.blast_fraction ?? 0;
    const blastPctNum = blastFraction * 100;
    const blastPctStr = blastPctNum.toFixed(1) + '%';
    const cellCount = analysis?.metrics?.cells_detected ?? 0;
    const meanConf = analysis?.metrics?.mean_confidence ?? (analysis?.mean_confidence ?? 0.85);
    const meanConfPct = Math.round(meanConf > 1 ? meanConf : meanConf * 100);

    // Blast tier evaluation
    let blastStatus = { label: 'Non-Elevated (< 5%)', color: '#10b981', bg: '#ecfdf5', border: '#a7f3d0', icon: 'fa-check-circle' };
    if (blastPctNum >= 20.0) {
        blastStatus = { label: 'Acute Leukemia Threshold (>= 20%)', color: '#dc2626', bg: '#fef2f2', border: '#fecaca', icon: 'fa-exclamation-circle' };
    } else if (blastPctNum >= 10.0) {
        blastStatus = { label: 'Excess Blasts-2 Range (10-19%)', color: '#ea580c', bg: '#fff7ed', border: '#fed7aa', icon: 'fa-exclamation-triangle' };
    } else if (blastPctNum >= 5.0) {
        blastStatus = { label: 'Excess Blasts-1 Range (5-9%)', color: '#d97706', bg: '#fffbeb', border: '#fde68a', icon: 'fa-info-circle' };
    }

    return (
        <div>
            {/* 1. Intake / Upload Card */}

                            Bone Marrow Aspirate Image Intake

                            High-power field (100x oil objective) Wright-Giemsa stained aspirate smear frames

                </div>

                <div
                    className={`upload-zone ${dragOver ? 'dragging' : ''}`}
                    onClick={() => !uploading && fileRef.current?.click()}
                    onDragOver={e => { e.preventDefault(); setDragOver(true); }}
