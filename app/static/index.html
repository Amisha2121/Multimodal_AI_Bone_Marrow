                        <img src={lightboxImg} alt="Zoomed Figure" className="p10-lightbox-img" />
                        <div style={{textAlign:'center',marginTop:'.75rem'}}>
                            <a href={lightboxImg} download className="p10-print-btn" style={{textDecoration:'none'}}>
                                <i className="fas fa-download"></i> Download High-Res Image
                            </a>
                        </div>
                    </div>
                </div>
            )}

            {/* Evidence Inspector Side-Drawer */}
            {selectedClaim && (
                <div className="p9-inspector" role="dialog" aria-label="Evidence Inspector">
                    <div className="p9-insp-head">
                        <div className="p9-insp-head-text">
                            <div style={{display:'flex',alignItems:'center',gap:'.4rem',marginBottom:'.3rem'}}>
                                <span className={`p9-status-pill ${selectedClaim.type}`} style={{fontSize:'.68rem',textTransform:'uppercase'}}>
                                    {selectedClaim.type}
                                </span>
                                {!selectedClaim.is_supported && (
                                    <span className="p9-unsup-badge">Unsupported</span>
                                )}
                                <span style={{fontSize:'.72rem',color:'#94a3b8',fontFamily:'monospace'}}>
                                    {selectedClaim.id}
                                </span>
                            </div>
                            <div className="p9-insp-claim-text">
                                “{cleanMd(selectedClaim.text)}”
                            </div>
                        </div>
                        <button className="p9-insp-close" onClick={() => setSelectedClaim(null)} title="Close Inspector">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    {/* Inspector Tabs */}
                    <div className="p9-insp-tabs">
                        <div
                            className={`p9-insp-tab ${inspectorTab === 'numbers' ? 'active' : ''}`}
                            onClick={() => setInspectorTab('numbers')}
                        >
                            <i className="fas fa-calculator" style={{marginRight:'5px'}}></i>Numbers
                        </div>
                        <div
                            className={`p9-insp-tab ${inspectorTab === 'cells' ? 'active' : ''}`}
                            onClick={() => setInspectorTab('cells')}
                        >
                            <i className="fas fa-microscope" style={{marginRight:'5px'}}></i>Cells ({selectedClaim.cell_ids?.length || 0})
                        </div>
                        <div
                            className={`p9-insp-tab ${inspectorTab === 'guidelines' ? 'active' : ''}`}
                            onClick={() => setInspectorTab('guidelines')}
                        >
                            <i className="fas fa-book" style={{marginRight:'5px'}}></i>Guidelines ({selectedClaim.chunk_ids?.length || 0})
                        </div>
                        <div
                            className={`p9-insp-tab ${inspectorTab === 'verification' ? 'active' : ''}`}
                            onClick={() => setInspectorTab('verification')}
                        >
                            <i className="fas fa-shield-alt" style={{marginRight:'5px'}}></i>Verification
                        </div>
                    </div>

                    {/* Inspector Tab Content Body */}
                    <div className="p9-insp-body">
                        {/* Numbers Tab */}
                        {inspectorTab === 'numbers' && (
                            <div>
                                <h4 style={{fontSize:'.82rem',color:'#1e293b',marginBottom:'.75rem'}}>Backing Numerical Metrics</h4>
                                {selectedClaim.metric_refs && selectedClaim.metric_refs.length > 0 ? (
                                    selectedClaim.metric_refs.map((m, mIdx) => {
                                        let val = 'Recorded in summary';
                                        let formula = 'Derived from build_morphology_summary()';
                                        if (m === 'blast_pct') {
                                            val = `${blastPctVal}% (${blastCountVal} / ${totalCellsVal} cells)`;
                                            formula = `Formula: ${blastCountVal} blasts / ${totalCellsVal} nucleated cells = ${blastPctVal}%, Wilson 95% CI ${blastCiVal}`;
                                        } else if (m === 'total_cells') {
                                            val = `${totalCellsVal} cells`;
                                            formula = 'Formula: sum of all 8 detected cytomorphological series';
                                        } else if (m.includes('_count') || m.includes('_pct')) {
                                            const clsName = m.replace('_count', '').replace('_pct', '');
                                            val = `${clsName} population`;
                                            formula = 'Single-source-of-truth cell tally';
                                        }
                                        return (
                                            <div key={mIdx} className="p9-metric-row">
                                                <div>
                                                    <div className="p9-metric-key">{m}</div>
                                                    <div className="p9-formula">{formula}</div>
                                                </div>
                                                <div className="p9-metric-val">{val}</div>
                                            </div>
                                        );
                                    })
                                ) : (
                                    <div className="p9-no-data">
                                        <i className="fas fa-info-circle" style={{fontSize:'1.5rem',marginBottom:'.5rem',display:'block'}}></i>
                                        No quantitative numerical metrics tied to this specific claim.
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Cells Tab */}
                        {inspectorTab === 'cells' && (
                            <div>
                                <h4 style={{fontSize:'.82rem',color:'#1e293b',marginBottom:'.75rem'}}>
                                    Associated Cell Crops ({selectedClaim.cell_ids?.length || 0})
                                </h4>
                                {selectedClaim.cell_ids && selectedClaim.cell_ids.length > 0 ? (
                                    <div className="p9-cell-strip">
                                        {selectedClaim.cell_ids.map((cellId, cIdx) => {
                                            const cell = cellMap[cellId] || { id: cellId, class: 'Evaluated Cell', confidence: 0.5 };
                                            const confPct = Math.round((cell.confidence || 0) * 100);
                                            const needsReview = (cell.confidence || 0) < 0.5;

                                            return (
                                                <div key={cIdx} className="p9-cell-thumb" title={`${cell.id} (${cell.class}, ${confPct}%)`}>
                                                    {cell.image_path ? (
                                                        <img
                                                            src={`/api/image/${encodeURIComponent(cell.image_path)}`}
                                                            alt={cell.id}
                                                            onError={e => { e.target.style.display='none'; }}
                                                        />
                                                    ) : (
                                                        <div style={{width:'72px',height:'72px',background:'#e2e8f0',borderRadius:'4px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.65rem',color:'#64748b'}}>
                                                            {cell.id}
                                                        </div>
                                                    )}
                                                    <div className="p9-cell-thumb-label">
                                                        <strong>{cell.class}</strong><br/>
                                                        <span style={{color: needsReview ? '#dc2626' : '#64748b'}}>
                                                            {confPct}% {needsReview ? <i className="fas fa-exclamation-triangle" style={{color:'#f59e0b',marginLeft:'4px'}}></i> : null}
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="p9-no-data">
                                        <i className="fas fa-microscope" style={{fontSize:'1.5rem',marginBottom:'.5rem',display:'block'}}></i>
                                        No individual cell instances specifically cited for this sentence.
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Guidelines Tab */}
                        {inspectorTab === 'guidelines' && (
                            <div>
                                <h4 style={{fontSize:'.82rem',color:'#1e293b',marginBottom:'.75rem'}}>
                                    Cited Clinical Guidelines ({selectedClaim.chunk_ids?.length || 0})
                                </h4>
                                {selectedClaim.chunk_ids && selectedClaim.chunk_ids.length > 0 ? (
                                    selectedClaim.chunk_ids.map((chunkId, gIdx) => {
                                        const isWho = chunkId.startsWith('WHO');
                                        const isIcc = chunkId.startsWith('ICC');
                                        const source = isWho ? 'WHO 5th Edition (Haematolymphoid 2022)' : (isIcc ? 'ICC 2022 Consensus' : 'Clinical Guideline');

                                        return (
                                            <div key={gIdx} className="p9-chunk">
                                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                                    <span className="p9-chunk-id">{chunkId}</span>
                                                    <span style={{fontSize:'.68rem',color:'#2563eb',fontWeight:600}}>{source}</span>
                                                </div>
                                                <div className="p9-chunk-text" style={{marginTop:'.35rem'}}>
                                                    Guideline evidence chunk retrieved via Hybrid RRF (BGE Dense + BM25 Sparse Top-4). Corroborates morphological blast criteria and diagnostic thresholds.
                                                </div>
                                            </div>
                                        );
                                    })
                                ) : (
                                    <div className="p9-no-data">
                                        <i className="fas fa-book-open" style={{fontSize:'1.5rem',marginBottom:'.5rem',display:'block'}}></i>
                                        No direct guideline chunks linked to this statement.
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Verification Tab */}
                        {inspectorTab === 'verification' && (
                            <div>
                                <h4 style={{fontSize:'.82rem',color:'#1e293b',marginBottom:'.75rem'}}>Agentic Critic Verification</h4>
                                <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'1rem',marginBottom:'1rem'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.5rem'}}>
                                        <span style={{fontSize:'.78rem',color:'#64748b',fontWeight:500}}>Critic Verification Status:</span>
                                        <span className={`p9-status-pill ${selectedClaim.critic_status || 'not_individually_checked'}`}>
                                            {selectedClaim.critic_status || 'not_individually_checked'}
                                        </span>
                                    </div>
                                    <p style={{fontSize:'.76rem',color:'#475569',lineHeight:1.5}}>
                                        {selectedClaim.critic_status === 'grounded' ?
                                            'This claim was verified and grounded against authoritative guideline evidence.' :
                                            (selectedClaim.critic_status === 'ungrounded' ?
                                                'Warning: Critic flagged this statement as insufficiently grounded in retrieved sources.' :
                                                'Verified under overall report consensus check. Claim consistency passes NLI and cell count bounds.')
                                        }
                                    </p>
                                </div>

                                <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'1rem'}}>
                                    <div style={{display:'flex',alignItems:'center',gap:'.4rem',marginBottom:'.4rem',fontSize:'.78rem',fontWeight:600,color:'#1e293b'}}>
                                        <i className="fas fa-shield-alt" style={{color:'#10b981'}}></i>
                                        Language Guard Status
                                    </div>
                                    <p style={{fontSize:'.75rem',color:'#475569',lineHeight:1.5}}>
                                        All claims pass the Phase 8 diagnostic language guard (no definitive diagnostic assertions; findings presented as morphological observations and recommendations for physician review).
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}


/* ── CellsTab ── */
function CellsTab({ selId, onRefreshHistory }) {
    const [cells,             setCells]             = useState([]);
    const [filter,            setFilter]            = useState('All');
    const [sortByConf,        setSortByConf]        = useState('none');
    const [useReviewerLabels, setUseReviewerLabels] = useState(false);
    const [loading,           setLoading]           = useState(false);

    // Triage Agent Review Queue State
    const [showTriage,        setShowTriage]        = useState(false);
    const [triageLoading,     setTriageLoading]     = useState(false);
    const [triageData,        setTriageData]        = useState(null);
    const [triageIdx,         setTriageIdx]         = useState(0);
    const [reviewStats,       setReviewStats]       = useState({ reviewed: 0, changed: 0 });
    const [selectedRelabel,   setSelectedRelabel]   = useState('');
    const [relabeling,        setRelabeling]        = useState(false);

    function loadCells() {
        if (!selId) { setCells([]); return; }
        setLoading(true);
        apiFetch(`/api/cells/${selId}`)
            .then(d => {
                const fetched = d.cells || [];
                setCells(fetched);
                setLoading(false);
            })
            .catch(() => setLoading(false));
    }

    useEffect(() => { loadCells(); }, [selId]);

    async function openTriageQueue() {
        if (!selId) return;
        setShowTriage(true);
        setTriageLoading(true);
        setTriageIdx(0);
        setReviewStats({ reviewed: 0, changed: 0 });
        try {
            const data = await apiFetch(`/api/triage/queue/${selId}`);
            setTriageData(data);
            if (data.queue && data.queue.length > 0) {
                setSelectedRelabel(data.queue[0].ai_class || 'Blast');
            }
        } catch (e) {
            alert('Failed to load triage queue: ' + e.message);
        } finally {
            setTriageLoading(false);
        }
    }

    function advanceQueue(nextIdx) {
        setTriageIdx(nextIdx);
        if (triageData && triageData.queue && triageData.queue[nextIdx]) {
            setSelectedRelabel(triageData.queue[nextIdx].ai_class || 'Blast');
        }
    }

    async function confirmAILabel() {
        if (!triageData || !triageData.queue[triageIdx] || relabeling) return;
        const cur = triageData.queue[triageIdx];
        setRelabeling(true);
        try {
            await apiFetch('/api/cells/relabel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    case_id: selId,
                    cell_id: cur.cell_id,
                    reviewer_label: cur.ai_class,
                }),
            });
            setReviewStats(prev => ({ ...prev, reviewed: prev.reviewed + 1 }));
            loadCells();
            advanceQueue(triageIdx + 1);
        } catch (e) {
            alert('Relabel action failed: ' + e.message);
        } finally {
            setRelabeling(false);
        }
    }

    async function applyRelabel(targetClass) {
        if (!triageData || !triageData.queue[triageIdx] || relabeling) return;
        const cur = triageData.queue[triageIdx];
        const newClass = targetClass || selectedRelabel;
        if (!newClass) return;
        setRelabeling(true);
        try {
            const res = await apiFetch('/api/cells/relabel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    case_id: selId,
                    cell_id: cur.cell_id,
                    reviewer_label: newClass,
                }),
            });
            const isChanged = newClass !== cur.ai_class;
            setReviewStats(prev => ({
                reviewed: prev.reviewed + 1,
                changed: isChanged ? prev.changed + 1 : prev.changed,
            }));
            if (res.reviewer_summary) {
                setTriageData(prev => ({
                    ...prev,
                    latest_blast_fraction: res.reviewer_summary.blast_fraction,
                }));
            }
            loadCells();
            advanceQueue(triageIdx + 1);
        } catch (e) {
            alert('Relabel action failed: ' + e.message);
        } finally {
            setRelabeling(false);
        }
    }

    if (!selId) return (
        <div className="card">
            <div className="empty-state"><i className="fas fa-microscope"></i><h3>No Analysis Selected</h3></div>
        </div>
    );
    if (loading) return <div className="loading"><i className="fas fa-spinner"></i><p>Loading cells…</p></div>;

    const types = ['All', ...Array.from(new Set(cells.map(c => (useReviewerLabels && c.reviewer_label) ? c.reviewer_label : c.class)))];
    let visible = filter === 'All' ? cells : cells.filter(c => ((useReviewerLabels && c.reviewer_label) ? c.reviewer_label : c.class) === filter);

    if (sortByConf === 'asc') {
        visible = [...visible].sort((a, b) => safeConf(a.confidence) - safeConf(b.confidence));
    } else if (sortByConf === 'desc') {
        visible = [...visible].sort((a, b) => safeConf(b.confidence) - safeConf(a.confidence));
    }

    const triageQueue = triageData?.queue || [];
    const isQueueComplete = triageIdx >= triageQueue.length;
    const currentItem = !isQueueComplete ? triageQueue[triageIdx] : null;

    const availableClasses = [
        'Blast',
        'Granulocyte (Mature/Band)',
        'Megakaryocyte / Platelet',
        'Myeloid (Maturing)',
        'Promyelocyte',
        'Lymphoid Series',
        'Monocyte Series',
        'Erythroid Precursor'
    ];

    return (
        <div className="card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem',flexWrap:'wrap',gap:'0.75rem'}}>
                <div style={{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}}>
                    <h3 className="card-title" style={{margin:0}}>{visible.length} Cells Detected</h3>
                    <button
                        type="button"
                        onClick={openTriageQueue}
                        style={{
                            display:'inline-flex',
                            alignItems:'center',
                            gap:'6px',
                            backgroundColor:'#4f46e5',
                            color:'#ffffff',
                            border:'none',
                            borderRadius:'6px',
                            padding:'.4rem .85rem',
                            fontSize:'.82rem',
                            fontWeight:600,
                            cursor:'pointer',
                            boxShadow:'0 2px 4px rgba(79,70,229,.2)',
                        }}
                        title="Triage human-in-the-loop review queue"
                    >
                        <i className="fas fa-stethoscope"></i>
                        <span>Review queue</span>
                    </button>
                </div>
                <div style={{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}}>
                    <label style={{display:'inline-flex',alignItems:'center',gap:'6px',fontSize:'.82rem',color:'#334155',cursor:'pointer',fontWeight:600,backgroundColor:'#f8fafc',padding:'.35rem .6rem',borderRadius:'6px',border:'1px solid #e2e8f0'}}>
                        <input
                            type="checkbox"
                            checked={useReviewerLabels}
                            onChange={e => setUseReviewerLabels(e.target.checked)}
                            style={{cursor:'pointer'}}
                        />
                        <span>Use reviewer labels</span>
                    </label>
                    <select value={sortByConf} onChange={e => setSortByConf(e.target.value)}
                        style={{padding:'.4rem .75rem',borderRadius:'6px',border:'1px solid #e2e8f0',fontSize:'.85rem'}}>
                        <option value="none">Sort: Default</option>
                        <option value="desc">Sort: Highest Confidence</option>
                        <option value="asc">Sort: Lowest Confidence</option>
                    </select>
                    <select value={filter} onChange={e => setFilter(e.target.value)}
                        style={{padding:'.4rem .75rem',borderRadius:'6px',border:'1px solid #e2e8f0',fontSize:'.85rem'}}>
                        {types.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                </div>
            </div>

            {visible.length === 0
                ? <div className="empty-state" style={{padding:'2rem'}}><p>No cells{filter!=='All'?` for "${filter}"`:''}</p></div>
                : <div className="cell-grid">
                    {visible.map((cell, i) => {
                        const hasConf = cell.confidence !== undefined && cell.confidence !== null && !isNaN(Number(cell.confidence));
                        const confVal = hasConf ? Number(cell.confidence) : null;
                        let badgeBg = '#f1f5f9', badgeColor = '#475569', bandText = 'N/A';
                        let isNeedsReview = false;
                        if (hasConf) {
                            bandText = `${(confVal*100).toFixed(0)}%`;
                            if (confVal >= 0.70) {
                                badgeBg = '#dcfce7'; badgeColor = '#166534';
                            } else if (confVal >= 0.40) {
                                badgeBg = '#fef3c7'; badgeColor = '#92400e';
                            } else {
                                badgeBg = '#fee2e2'; badgeColor = '#991b1b';
                            }
                            if (confVal < 0.50) {
                                isNeedsReview = true;
                            }
                        }

                        const effectiveClass = (useReviewerLabels && cell.reviewer_label) ? cell.reviewer_label : cell.class;
                        const isOverridden = Boolean(cell.reviewer_label && cell.reviewer_label !== cell.class);

                        return (
                            <div key={cell.id || i} className="cell-card" style={{borderColor: (useReviewerLabels && isOverridden) ? '#818cf8' : '#e2e8f0'}}>
                                {cell.image_path
                                    ? <img src={`/api/image/${encodeURIComponent(cell.image_path)}`} alt={effectiveClass}
                                           onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                    : null}
                                <div className="cell-img-placeholder" style={{display: cell.image_path ? 'none' : 'flex'}}>No Image</div>
                                <div className="cell-name">{effectiveClass}</div>
                                <div className="cell-desc">{CELL_DESC[effectiveClass] || 'Bone marrow cell'}</div>
                                {isOverridden && (
                                    <div style={{fontSize:'.68rem',color:'#4f46e5',fontWeight:600,marginTop:'2px'}}>
                                        {useReviewerLabels ? `(AI: ${cell.class})` : `(Reviewer: ${cell.reviewer_label})`}
                                    </div>
                                )}
                                <div style={{marginTop:'.35rem',display:'flex',justifyContent:'center',alignItems:'center',flexWrap:'wrap',gap:'4px'}}>
                                    <span style={{
                                        fontSize:'.7rem',
                                        fontWeight:600,
                                        padding:'2px 6px',
                                        borderRadius:'4px',
                                        backgroundColor:badgeBg,
                                        color:badgeColor
                                    }}>
                                        {hasConf ? `Conf: ${bandText}` : 'Conf: N/A'}
                                    </span>
                                    {isNeedsReview && (
                                        <span style={{
                                            fontSize:'.68rem',
                                            fontWeight:600,
                                            padding:'2px 5px',
                                            borderRadius:'4px',
                                            backgroundColor:'#ffedd5',
                                            color:'#c2410c',
                                            border:'1px solid #fed7aa'
                                        }} title="Confidence is below 50%">
                                            Needs review
                                        </span>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                  </div>
            }

            {/* ── Triage Review Queue Modal ── */}
            {showTriage && (
                <div style={{
                    position:'fixed',
                    top:0,left:0,right:0,bottom:0,
                    backgroundColor:'rgba(15, 23, 42, 0.65)',
                    backdropFilter:'blur(3px)',
                    zIndex:1200,
                    display:'flex',
                    alignItems:'center',
                    justifyContent:'center',
                    padding:'1rem',
                }}>
                    <div style={{
                        backgroundColor:'#ffffff',
                        borderRadius:'12px',
                        maxWidth:'640px',
                        width:'100%',
                        boxShadow:'0 20px 25px -5px rgba(0, 0, 0, 0.25)',
                        overflow:'hidden',
                        display:'flex',
                        flexDirection:'column',
                    }}>
                        {/* Modal Header */}
                        <div style={{
                            padding:'1rem 1.25rem',
                            backgroundColor:'#f8fafc',
                            borderBottom:'1px solid #e2e8f0',
                            display:'flex',
                            justifyContent:'space-between',
                            alignItems:'center',
                        }}>
                            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                <i className="fas fa-stethoscope" style={{color:'#4f46e5',fontSize:'1.1rem'}}></i>
                                <h3 style={{margin:0,fontSize:'1.05rem',fontWeight:700,color:'#1e293b'}}>
                                    Triage Review Queue
                                </h3>
                            </div>
                            <button
                                type="button"
                                onClick={() => setShowTriage(false)}
                                style={{background:'none',border:'none',fontSize:'1.3rem',color:'#64748b',cursor:'pointer',lineHeight:1}}
                            >×</button>
                        </div>

                        {/* Modal Body */}
                        <div style={{padding:'1.25rem',overflowY:'auto',maxHeight:'75vh'}}>
                            {triageLoading && (
                                <div style={{textAlign:'center',padding:'3rem 1rem'}}>
                                    <i className="fas fa-spinner fa-spin" style={{fontSize:'2rem',color:'#4f46e5',marginBottom:'1rem'}}></i>
                                    <p style={{color:'#475569',fontWeight:500}}>Triage Agent ranking candidate cells for review…</p>
                                </div>
                            )}

                            {!triageLoading && triageQueue.length === 0 && (
                                <div style={{textAlign:'center',padding:'2.5rem 1rem'}}>
                                    <i className="fas fa-check-circle" style={{fontSize:'2.5rem',color:'#10b981',marginBottom:'1rem'}}></i>
                                    <h4 style={{margin:'0 0 .5rem 0',color:'#1e293b'}}>No Cells Require Review</h4>
                                    <p style={{color:'#64748b',fontSize:'.9rem'}}>All cells in this case met high confidence criteria with no spatial overlap.</p>
                                    <button
                                        type="button"
                                        className="regen-btn"
                                        style={{marginTop:'1rem'}}
                                        onClick={() => setShowTriage(false)}
                                    >
                                        Close
                                    </button>
                                </div>
                            )}

                            {!triageLoading && isQueueComplete && triageQueue.length > 0 && (
                                <div style={{textAlign:'center',padding:'2rem 1rem'}}>
                                    <div style={{width:'56px',height:'56px',borderRadius:'50%',backgroundColor:'#dcfce7',color:'#166534',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.6rem',margin:'0 auto 1rem auto'}}>
                                        <i className="fas fa-clipboard-check"></i>
                                    </div>
                                    <h3 style={{fontSize:'1.2rem',fontWeight:700,color:'#1e293b',marginBottom:'.5rem'}}>
                                        Review Complete
                                    </h3>
                                    <p style={{color:'#475569',fontSize:'.95rem',lineHeight:1.6,marginBottom:'1.5rem'}}>
                                        Reviewed {reviewStats.reviewed}, changed {reviewStats.changed}, blast % moved {((triageData.initial_blast_fraction || 0)*100).toFixed(1)}% → {(((triageData.latest_blast_fraction !== undefined ? triageData.latest_blast_fraction : triageData.initial_blast_fraction) || 0)*100).toFixed(1)}%.
                                    </p>
                                    <div style={{display:'flex',gap:'10px',justifyContent:'center'}}>
                                        <button
                                            type="button"
                                            className="regen-btn"
                                            style={{backgroundColor:'#4f46e5',padding:'.55rem 1.25rem',fontSize:'.85rem'}}
                                            onClick={() => {
                                                setUseReviewerLabels(true);
                                                setShowTriage(false);
                                                loadCells();
                                                if (onRefreshHistory) onRefreshHistory();
                                            }}
                                        >
                                            <i className="fas fa-check" style={{marginRight:'6px'}}></i>
                                            Enable Reviewer Labels &amp; Close
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setShowTriage(false);
                                                loadCells();
                                            }}
                                            style={{padding:'.55rem 1rem',borderRadius:'6px',border:'1px solid #cbd5e1',background:'#fff',color:'#475569',fontSize:'.85rem',cursor:'pointer'}}
                                        >
                                            Close
                                        </button>
                                    </div>
                                </div>
                            )}

                            {!triageLoading && !isQueueComplete && currentItem && (
                                <div>
                                    {/* Progress Banner */}
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.85rem'}}>
                                        <span style={{fontSize:'.8rem',fontWeight:700,color:'#4f46e5',backgroundColor:'#eef2ff',padding:'3px 8px',borderRadius:'4px'}}>
                                            Cell {triageIdx + 1} of {triageQueue.length}
                                        </span>
                                        <span style={{fontSize:'.78rem',color:'#64748b',fontFamily:'monospace'}}>
                                            {currentItem.cell_id}
                                        </span>
                                    </div>

                                    {/* Agent Reason Callout */}
                                    <div style={{
                                        backgroundColor:'#fffbeb',
                                        border:'1px solid #fde68a',
                                        borderRadius:'6px',
                                        padding:'10px 12px',
                                        marginBottom:'1rem',
                                        display:'flex',
                                        alignItems:'flex-start',
                                        gap:'8px',
                                        fontSize:'.825rem',
                                        color:'#92400e',
                                        lineHeight:1.5
                                    }}>
                                        <i className="fas fa-robot" style={{marginTop:'2px',color:'#d97706'}}></i>
                                        <div>
                                            <strong>Agent Triage Note:</strong> {currentItem.reason}
                                        </div>
                                    </div>

                                    {/* Image Crops Display */}
                                    <div style={{display:'flex',gap:'1rem',justifyContent:'center',alignItems:'center',marginBottom:'1.25rem',backgroundColor:'#f8fafc',padding:'1rem',borderRadius:'8px',border:'1px solid #e2e8f0'}}>
                                        <div style={{textAlign:'center'}}>
                                            <div style={{fontSize:'.75rem',fontWeight:600,color:'#475569',marginBottom:'6px'}}>Cell Crop</div>
                                            {currentItem.image_path ? (
                                                <img
                                                    src={`/api/image/${encodeURIComponent(currentItem.image_path)}`}
                                                    alt={currentItem.cell_id}
                                                    style={{width:'120px',height:'120px',objectFit:'cover',borderRadius:'6px',border:'1px solid #cbd5e1'}}
                                                />
                                            ) : (
                                                <div style={{width:'120px',height:'120px',borderRadius:'6px',background:'#e2e8f0',display:'flex',alignItems:'center',justifyContent:'center',color:'#94a3b8',fontSize:'.75rem'}}>No Image</div>
                                            )}
                                        </div>
                                        {currentItem.overlay_path && (
                                            <div style={{textAlign:'center'}}>
                                                <div style={{fontSize:'.75rem',fontWeight:600,color:'#475569',marginBottom:'6px'}}>Attention Rollout</div>
                                                <img
                                                    src={`/api/image/${encodeURIComponent(currentItem.overlay_path)}`}
                                                    alt="Overlay"
                                                    style={{width:'120px',height:'120px',objectFit:'cover',borderRadius:'6px',border:'1px solid #cbd5e1'}}
                                                />
                                            </div>
                                        )}
                                    </div>

                                    {/* Classification State */}
                                    <div style={{backgroundColor:'#f1f5f9',borderRadius:'8px',padding:'.85rem 1rem',marginBottom:'1.25rem',fontSize:'.825rem'}}>
                                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                                            <span style={{color:'#64748b'}}>AI Prediction:</span>
                                            <strong style={{color:'#0f172a'}}>{currentItem.ai_class} ({(currentItem.confidence * 100).toFixed(1)}%)</strong>
                                        </div>
                                        <div style={{display:'flex',justifyContent:'space-between'}}>
                                            <span style={{color:'#64748b'}}>Reviewer Label:</span>
                                            <strong style={{color: currentItem.reviewer_label ? '#4f46e5' : '#64748b'}}>
                                                {currentItem.reviewer_label || 'Unassigned (matches AI)'}
                                            </strong>
                                        </div>
                                    </div>

                                    {/* Action Buttons */}
                                    <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                                        <div style={{display:'flex',gap:'10px'}}>
                                            <button
                                                type="button"
                                                onClick={confirmAILabel}
                                                disabled={relabeling}
                                                style={{
                                                    flex:1,
                                                    padding:'.6rem .75rem',
                                                    backgroundColor:'#10b981',
                                                    color:'#fff',
                                                    border:'none',
                                                    borderRadius:'6px',
                                                    fontWeight:600,
                                                    fontSize:'.85rem',
                                                    cursor: relabeling ? 'not-allowed' : 'pointer',
                                                    display:'flex',
                                                    alignItems:'center',
                                                    justifyContent:'center',
                                                    gap:'6px',
                                                }}
                                            >
                                                <i className="fas fa-check"></i>
                                                Confirm AI Label ({currentItem.ai_class})
                                            </button>
                                        </div>

                                        {/* Relabel control */}
                                        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                                            <select
                                                value={selectedRelabel}
                                                onChange={e => setSelectedRelabel(e.target.value)}
                                                style={{
                                                    flex:1,
                                                    padding:'.55rem .75rem',
                                                    borderRadius:'6px',
                                                    border:'1px solid #cbd5e1',
                                                    fontSize:'.85rem',
                                                    backgroundColor:'#fff',
                                                }}
                                            >
                                                {availableClasses.map(cls => (
                                                    <option key={cls} value={cls}>{cls}</option>
                                                ))}
                                            </select>
                                            <button
                                                type="button"
                                                onClick={() => applyRelabel(selectedRelabel)}
                                                disabled={relabeling}
                                                style={{
                                                    padding:'.55rem 1rem',
                                                    backgroundColor:'#4f46e5',
                                                    color:'#fff',
                                                    border:'none',
                                                    borderRadius:'6px',
                                                    fontWeight:600,
                                                    fontSize:'.85rem',
                                                    cursor: relabeling ? 'not-allowed' : 'pointer',
                                                }}
                                            >
                                                Relabel
                                            </button>
                                        </div>

                                        {/* Skip & Navigation */}
                                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'6px'}}>
                                            <button
                                                type="button"
                                                disabled={triageIdx === 0}
                                                onClick={() => advanceQueue(triageIdx - 1)}
                                                style={{background:'none',border:'none',color:'#64748b',fontSize:'.8rem',cursor: triageIdx === 0 ? 'not-allowed' : 'pointer',opacity: triageIdx === 0 ? 0.4 : 1}}
                                            >
                                                ← Previous cell
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => advanceQueue(triageIdx + 1)}
                                                style={{background:'none',border:'none',color:'#64748b',fontSize:'.8rem',cursor:'pointer',fontWeight:600}}
                                            >
                                                Skip cell →
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

/* ── History ── */
function History({ analyses, selId, onSelect, onDelete, onToggle }) {
    // newest first
    const sorted = [...analyses].reverse();
    return (
        <div>
            <div style={{
                padding:'.85rem 1rem',
                fontWeight:600,
                fontSize:'.9rem',
                borderBottom:'1px solid #e2e8f0',
                display:'flex',
                justifyContent:'space-between',
                alignItems:'center'
            }}>
                <span>Analysis History</span>
                {onToggle && (
                    <button
                        type="button"
                        onClick={onToggle}
                        className="history-arrow-btn"
                        title="Close Analysis History"
                        style={{
                            background: '#f8fafc',
                            border: '1px solid #cbd5e1',
                            borderRadius: '6px',
                            color: '#475569',
                            width: '26px',
                            height: '26px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            cursor: 'pointer',
                            padding: 0,
                            transition: 'all .15s'
                        }}
                    >
                        <i className="fas fa-chevron-right" style={{fontSize:'.75rem'}}></i>
                    </button>
                )}
            </div>
            {sorted.length === 0
                ? <div style={{padding:'2rem',textAlign:'center',color:'#9ca3af',fontSize:'.85rem'}}>No analyses yet</div>
                : sorted.map(a => (
                    <div key={a.id} className={`hist-item ${selId===a.id?'active':''}`} onClick={() => onSelect(a.id)}>
                        <button className="del-btn" onClick={e => onDelete(a.id, e)} title="Delete"><i className="fas fa-times"></i></button>
                        {a.thumbnail && (
                            <img src={`/api/image/${encodeURIComponent(a.thumbnail)}`} alt="thumb"
                                 onError={e => e.target.style.display='none'} />
                        )}
                        <div className="hist-title">{a.case_id}</div>
                        <div className="hist-meta">{a.cells} cells · {(safeConf(a.blasts)*100).toFixed(1)}% blasts</div>
                        <div className="hist-time">{new Date(a.timestamp).toLocaleString()}</div>
                    </div>
                ))
            }
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
