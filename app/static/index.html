<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bone Marrow Cytomorphology Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;background:#f5f7fa;color:#2d3748;line-height:1.6;}
        .app{display:flex;height:100vh;}

        /* ── Sidebar ── */
        .sidebar{width:200px;min-width:200px;background:#1a202c;color:#fff;display:flex;flex-direction:column;flex-shrink:0;}
        .sidebar-header{padding:1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,.1);}
        .sidebar-header h1{font-size:1rem;font-weight:700;margin-bottom:.2rem;}
        .sidebar-header p{font-size:.75rem;color:#a0aec0;}
        .sidebar-nav{flex:1;padding:.5rem 0;}
        .nav-item{padding:.65rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;font-size:.85rem;border-left:3px solid transparent;transition:all .15s;}
        .nav-item:hover{background:rgba(255,255,255,.06);}
        .nav-item.active{background:rgba(59,130,246,.18);border-left-color:#3b82f6;color:#fff;}
        .nav-item i{width:16px;text-align:center;font-size:.85rem;}

        /* ── Main ── */
        .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.85rem 1.5rem;}
        .topbar h2{font-size:1.3rem;font-weight:600;color:#1a202c;}
        .content-area{flex:1;display:flex;overflow:hidden;}
        .content-main{flex:1;padding:1.5rem;overflow-y:auto;}
        .content-main.chat-view{padding:0;}
        .content-sidebar{width:280px;min-width:280px;background:#fff;border-left:1px solid #e2e8f0;overflow-y:auto;}

        /* ── Cards ── */
        .card{background:#fff;border-radius:8px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1.25rem;}
        .card-title{font-size:1rem;font-weight:600;margin-bottom:.85rem;color:#1a202c;}

        /* ── Metrics ── */
        .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.85rem;margin-bottom:1.25rem;}
        .metric-card{background:#fff;border-radius:8px;padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.08);}
        .metric-label{font-size:.8rem;color:#718096;margin-bottom:.35rem;font-weight:500;}
        .metric-value{font-size:1.75rem;font-weight:700;color:#1a202c;}

        /* ── Upload ── */
        .upload-zone{border:2px dashed #cbd5e0;border-radius:8px;padding:2.5rem;text-align:center;cursor:pointer;transition:all .2s;}
        .upload-zone:hover{border-color:#3b82f6;background:#f7fafc;}
        .upload-zone i{font-size:2.5rem;color:#a0aec0;margin-bottom:.75rem;}
        input[type="file"]{display:none;}

        /* ── Image tabs ── */
        .img-tabs{display:flex;gap:.25rem;margin-bottom:.85rem;border-bottom:2px solid #e2e8f0;}
        .img-tab{padding:.6rem 1rem;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;font-weight:500;color:#718096;font-size:.85rem;transition:all .15s;margin-bottom:-2px;}
        .img-tab.active{color:#3b82f6;border-bottom-color:#3b82f6;}
        .img-tab:hover{background:#f7fafc;}

        /* ── Table ── */
        table{width:100%;border-collapse:collapse;font-size:.875rem;}
        thead{background:#f7fafc;}
        th{text-align:left;padding:.65rem .75rem;font-weight:600;border-bottom:2px solid #e2e8f0;}
        td{padding:.65rem .75rem;border-bottom:1px solid #e2e8f0;}

        /* ── Chat ── */
        .chat-container{display:flex;flex-direction:column;height:100%;}
        .chat-messages{flex:1;overflow-y:auto;padding:1.5rem 0;}
        .chat-messages::-webkit-scrollbar{width:6px;}
        .chat-messages::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
        .msg-wrap{width:100%;display:flex;justify-content:center;padding:1rem;}
        .msg-wrap.user{background:#f7f7f8;}
        .msg-wrap.assistant{background:#fff;}
        .msg-inner{max-width:720px;width:100%;display:flex;gap:1rem;}
        .avatar{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:.8rem;}
        .avatar.user{background:#3b82f6;color:#fff;}
        .avatar.assistant{background:#10a37f;color:#fff;}
        .msg-text{flex:1;padding-top:.15rem;line-height:1.75;color:#374151;font-size:.9rem;}
        .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9ca3af;padding:2rem;text-align:center;}
        .chat-empty h3{color:#6b7280;margin-bottom:.5rem;}
        .chat-input-area{padding:1rem 1.5rem;border-top:1px solid #e5e7eb;background:#fff;}
        .chat-input-row{max-width:720px;margin:0 auto;position:relative;}
        .chat-input{width:100%;padding:.85rem 3rem .85rem 1rem;border:1px solid #d1d5db;border-radius:10px;resize:none;font-family:inherit;font-size:.9rem;line-height:1.5;}
        .chat-input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1);}
        .send-btn{position:absolute;right:.5rem;bottom:.5rem;width:30px;height:30px;border-radius:6px;border:none;background:#3b82f6;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
        .send-btn:hover:not(:disabled){background:#2563eb;}
        .send-btn:disabled{background:#d1d5db;cursor:not-allowed;}

        /* ── Report ── */
        .report-header{background:#fff;border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);}
        .report-header h1{font-size:1.5rem;font-weight:700;}
        .report-warning{background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:1rem;margin-bottom:1.25rem;color:#92400e;font-size:.875rem;}
        .report-section{background:#fff;border-radius:8px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #3b82f6;}
        .report-section h3{font-size:1.1rem;font-weight:600;margin-bottom:.85rem;color:#1a202c;}
        .report-text{line-height:1.8;color:#4a5568;font-size:.9rem;white-space:pre-wrap;}
        .report-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.75rem;margin-top:1rem;}
        .report-imgs img{width:100%;height:110px;object-fit:cover;border-radius:6px;border:1px solid #e2e8f0;}

        /* ── Cell Explorer ── */
        .cell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.85rem;}
        .cell-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.65rem;text-align:center;}
        .cell-card img{width:100%;height:110px;object-fit:cover;border-radius:4px;margin-bottom:.4rem;border:1px solid #e2e8f0;}
        .cell-img-placeholder{width:100%;height:110px;background:#f0f0f0;border-radius:4px;margin-bottom:.4rem;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:.75rem;}
        .cell-name{font-weight:600;font-size:.8rem;color:#1a202c;margin-bottom:.15rem;}
        .cell-desc{font-size:.7rem;color:#718096;}
        .cell-conf{font-size:.7rem;color:#3b82f6;font-weight:600;margin-top:.2rem;}

        /* ── History ── */
        .hist-item{padding:.85rem;border-bottom:1px solid #e2e8f0;cursor:pointer;transition:all .15s;position:relative;}
        .hist-item:hover{background:#f7fafc;}
        .hist-item.active{background:#eff6ff;border-left:3px solid #3b82f6;}
        .hist-item img{width:100%;height:90px;object-fit:cover;border-radius:4px;margin-bottom:.4rem;}
        .hist-title{font-weight:600;font-size:.8rem;color:#1a202c;margin-bottom:.2rem;}
        .hist-meta{font-size:.72rem;color:#718096;}
        .hist-time{font-size:.68rem;color:#a0aec0;margin-top:.15rem;}
        .del-btn{position:absolute;top:.5rem;right:.5rem;width:22px;height:22px;background:#ef4444;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:.65rem;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;}
        .hist-item:hover .del-btn{opacity:1;}

        /* ── Util ── */
        .loading{text-align:center;padding:3rem;color:#3b82f6;}
        .loading i{font-size:2.5rem;animation:spin 1s linear infinite;margin-bottom:.75rem;}
        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        .empty-state{text-align:center;padding:3rem;color:#9ca3af;}
        .empty-state i{font-size:3rem;margin-bottom:1rem;opacity:.4;}
        .error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:1rem;color:#dc2626;font-size:.875rem;}

        /* ── Heatmap ── */
        .heatmap-bar{transition:width 0.8s cubic-bezier(.4,0,.2,1);}
        .treemap-wrap{display:flex;flex-wrap:nowrap;border-radius:8px;overflow:hidden;height:56px;margin-top:1rem;border:1px solid #e2e8f0;}
        .treemap-cell{display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:default;overflow:hidden;}
        .treemap-cell:hover{filter:brightness(1.15);transform:scaleY(1.06);}
        .heatmap-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:.6rem;}
        .heatmap-legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:#64748b;}
        .heatmap-swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}
        .regen-btn{background:#3b82f6;color:#fff;border:none;padding:.45rem 1rem;border-radius:6px;font-size:.8rem;cursor:pointer;font-weight:500;transition:all .15s;}
        .regen-btn:hover{background:#2563eb;box-shadow:0 2px 8px rgba(59,130,246,.3);}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══════════════════════════════════════════════════════════ helpers */
async function apiFetch(url, opts = {}) {
    const res = await fetch(url, opts);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
}

function safeConf(v) {
    const n = parseFloat(v);
    return isNaN(n) || !isFinite(n) ? 0 : n;
}

const CELL_DESC = {
    "Blast":                   "Immature precursor cell",
    "Lymphoid Series":         "Mature lymphocyte",
    "Granulocyte (Mature)":    "Mature neutrophil",
    "Granulocyte (Mature/Band)":"Band neutrophil",
    "Granulocyte (Immature)":  "Early myeloid cell",
    "Erythroid Precursor":     "RBC precursor",
    "Monocyte":                "Large phagocyte",
    "Monocyte Series":         "Monocytic lineage",
    "Megakaryocyte/Platelet":  "Platelet producer",
    "Promyelocyte":            "Early myeloid stage",
    "Myeloid (Maturing)":      "Maturing myeloid cell",
    "Promonocyte":             "Monocyte precursor",
};

/* ═══════════════════════════════════════════════════════════ App */
function App() {
    const [tab, setTab]           = useState('upload');
    const [analyses, setAnalyses] = useState([]);
    const [selId, setSelId]       = useState(null);
    const [uploading, setUploading] = useState(false);

    useEffect(() => { fetchList(); }, []);

    async function fetchList() {
        try {
            const d = await apiFetch('/api/analyses');
            const list = d.analyses || [];
            setAnalyses(list);
            // auto-select most-recent
            if (list.length > 0 && !selId) setSelId(list[list.length - 1].id);
        } catch {}
    }

    async function handleUpload(files) {
        setUploading(true);
        const fd = new FormData();
        Array.from(files).forEach(f => fd.append('files', f));
        try {
            const d = await apiFetch('/api/upload', { method: 'POST', body: fd });
            if (d.success) {
                await fetchList();
                setSelId(d.analysis_id);
                setTab('upload');
            }
        } catch (e) {
            alert('Upload failed: ' + e.message);
        } finally {
            setUploading(false);
        }
    }

    async function handleDelete(id, e) {
        e.stopPropagation();
        if (!confirm('Delete this analysis?')) return;
        try {
            await apiFetch(`/api/analysis/${id}`, { method: 'DELETE' });
            await fetchList();
            if (selId === id) setSelId(null);
        } catch {}
    }

    return (
        <div className="app">
            <Sidebar tab={tab} setTab={setTab} />
            <div className="main-content">
                <Topbar tab={tab} />
                <div className="content-area">
                    <div className={`content-main ${tab === 'chat' ? 'chat-view' : ''}`}>
                        {tab === 'upload'  && <UploadTab  selId={selId} onUpload={handleUpload} uploading={uploading} />}
                        {tab === 'chat'    && <ChatTab    selId={selId} />}
                        {tab === 'report'  && <ReportTab  selId={selId} />}
                        {tab === 'cells'   && <CellsTab   selId={selId} />}
                    </div>
                    <div className="content-sidebar">
                        <History analyses={analyses} selId={selId} onSelect={setSelId} onDelete={handleDelete} />
                    </div>
                </div>
            </div>
        </div>
    );
}

/* ── Sidebar ── */
function Sidebar({ tab, setTab }) {
    const items = [
        { id: 'upload', icon: 'fa-upload',      label: 'Upload & Analyze' },
        { id: 'chat',   icon: 'fa-comments',     label: 'Ask Questions'   },
        { id: 'report', icon: 'fa-file-medical', label: 'RAG Report'      },
        { id: 'cells',  icon: 'fa-microscope',   label: 'Cell Explorer'   },
    ];
    return (
        <div className="sidebar">
            <div className="sidebar-header">
                <h1>🔬 Bone Marrow Analysis</h1>
                <p>Cytomorphology Assistant</p>
            </div>
            <div className="sidebar-nav">
                {items.map(it => (
                    <div key={it.id} className={`nav-item ${tab === it.id ? 'active' : ''}`} onClick={() => setTab(it.id)}>
                        <i className={`fas ${it.icon}`}></i> {it.label}
                    </div>
                ))}
            </div>
        </div>
    );
}

/* ── Topbar ── */
function Topbar({ tab }) {
    const titles = { upload: 'Upload & Analyze Images', chat: 'Ask Questions', report: 'Comprehensive RAG Report', cells: 'Cell Explorer' };
    return <div className="topbar"><h2>{titles[tab]}</h2></div>;
}

/* ── CellHeatmap ── */
function CellHeatmap({ morphology }) {
    if (!morphology || morphology.length === 0) return null;
    const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#6366f1','#84cc16','#a855f7'];
    const sorted = [...morphology].sort((a, b) => b.count - a.count);
    const total  = sorted.reduce((s, m) => s + m.count, 0) || 1;
    const maxCnt = sorted[0]?.count || 1;
    return (
        <div className="card">
            <h3 className="card-title"><span style={{marginRight:'6px'}}>🔥</span>Cell Distribution Heatmap</h3>
            <div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
                {sorted.map((m, i) => {
                    const pct = ((m.percentage ?? m.count/total) * 100);
                    const barW = Math.max(6, (m.count / maxCnt) * 100);
                    const c = COLORS[i % COLORS.length];
                    return (
                        <div key={m.type} style={{display:'flex',alignItems:'center',gap:'10px'}}>
                            <div style={{width:'150px',fontSize:'.78rem',fontWeight:600,textAlign:'right',color:'#4a5568',flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={m.type}>{m.type}</div>
                            <div style={{flex:1,background:'#f1f5f9',borderRadius:'4px',height:'26px',overflow:'hidden'}}>
                                <div className="heatmap-bar" style={{width:barW+'%',height:'100%',background:'linear-gradient(90deg,'+c+'88,'+c+')',borderRadius:'4px',display:'flex',alignItems:'center',paddingLeft:'8px',minWidth:'50px'}}>
                                    <span style={{fontSize:'.7rem',fontWeight:700,color:'#fff',textShadow:'0 1px 2px rgba(0,0,0,.35)',whiteSpace:'nowrap'}}>{m.count} ({pct.toFixed(1)}%)</span>
                                </div>
                            </div>
                        </div>
                    );
                })}
            </div>
            <div className="treemap-wrap">
                {sorted.map((m, i) => {
                    const pct = (m.percentage ?? m.count/total) * 100;
                    if (pct < 0.5) return null;
                    return (
                        <div key={m.type} className="treemap-cell" title={m.type+': '+m.count+' cells ('+pct.toFixed(1)+'%)'}
                            style={{width:pct+'%',height:'100%',background:COLORS[i%COLORS.length]}}>
                            {pct > 8 && <span style={{fontSize:'.6rem',fontWeight:700,color:'#fff',textShadow:'0 1px 3px rgba(0,0,0,.45)',textAlign:'center',lineHeight:1.2,padding:'0 2px'}}>{m.type.length>14?m.type.split(/[\s(/]/)[0]:m.type}<br/>{pct.toFixed(0)}%</span>}
                        </div>
                    );
                })}
            </div>
            <div className="heatmap-legend">
                {sorted.map((m, i) => (
                    <div key={m.type} className="heatmap-legend-item">
                        <span className="heatmap-swatch" style={{background:COLORS[i%COLORS.length]}}></span>{m.type}
                    </div>
                ))}
            </div>
        </div>
    );
}

/* ── UploadTab ── */
function UploadTab({ selId, onUpload, uploading }) {
    const [analysis, setAnalysis] = useState(null);
    const [imgView,  setImgView]  = useState('filtered');
    const fileRef = useRef();

    useEffect(() => {
        if (!selId) { setAnalysis(null); return; }
        apiFetch(`/api/analysis/${selId}`).then(setAnalysis).catch(() => setAnalysis(null));
    }, [selId]);

    function pick(e) {
        const files = e.target.files;
        if (files.length) onUpload(files);
        e.target.value = '';
    }

    const imgKey = imgView === 'raw' ? 'raw' : imgView === 'contact' ? 'contact' : 'filtered';
    const imgPath = analysis?.detection_images?.[imgKey];

    return (
        <div>
            <div className="card">
                <h3 className="card-title">Upload Bone Marrow Images</h3>
                <label>
                    <div className="upload-zone" onClick={() => fileRef.current.click()}>
                        <i className="fas fa-cloud-upload-alt"></i>
                        <h3>{uploading ? 'Analyzing…' : 'Click to upload images'}</h3>
                        <p style={{color:'#718096',fontSize:'.875rem'}}>PNG, JPG, JPEG, TIFF · Multiple files allowed</p>
                    </div>
                </label>
                <input ref={fileRef} type="file" multiple accept=".png,.jpg,.jpeg,.tiff,.tif" onChange={pick} disabled={uploading} />
            </div>

            {uploading && (
                <div className="loading"><i className="fas fa-spinner"></i><p>Analysing images…</p></div>
            )}

            {analysis && !uploading && (
                <>
                    <div className="metrics-grid">
                        {[
                            ['Images Processed',  analysis.metrics?.images_processed  ?? 0],
                            ['Cells Detected',    analysis.metrics?.cells_detected    ?? 0],
                            ['Cells Classified',  analysis.metrics?.cells_classified  ?? 0],
                            ['Blast %',           ((analysis.metrics?.blast_fraction ?? 0)*100).toFixed(1)+'%'],
                        ].map(([lbl, val]) => (
                            <div key={lbl} className="metric-card">
                                <div className="metric-label">{lbl}</div>
                                <div className="metric-value">{val}</div>
                            </div>
                        ))}
                    </div>

                    <CellHeatmap morphology={analysis.morphology} />

                    <div className="card">
                        <div className="img-tabs">
                            {[['raw','Raw Candidates'],['filtered','Filtered Detection'],['contact','Contact Sheet']].map(([k,lbl]) => (
                                <button key={k} className={`img-tab ${imgView===k?'active':''}`} onClick={() => setImgView(k)}>
                                    {lbl}
                                </button>
                            ))}
                        </div>
                        {imgPath
                            ? <img src={`/api/image/${encodeURIComponent(imgPath)}`} alt={imgView} style={{width:'100%',borderRadius:'6px'}} onError={e=>e.target.style.display='none'} />
                            : <div className="empty-state" style={{padding:'2rem'}}><p style={{color:'#9ca3af'}}>Image not available for this view</p></div>
                        }
                    </div>

                    <div className="card">
                        <h3 className="card-title">Cell Distribution</h3>
                        <table>
                            <thead><tr><th>Cell Type</th><th style={{textAlign:'center'}}>Count</th><th style={{textAlign:'center'}}>%</th></tr></thead>
                            <tbody>
                                {(analysis.morphology || []).map(m => (
                                    <tr key={m.type}>
                                        <td><strong>{m.type}</strong></td>
                                        <td style={{textAlign:'center',fontWeight:600}}>{m.count}</td>
                                        <td style={{textAlign:'center'}}>{(m.percentage*100).toFixed(1)}%</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </>
            )}
        </div>
    );
}

/* ── ChatTab ── */
function ChatTab({ selId }) {
    const [msgs,     setMsgs]    = useState([]);
    const [input,    setInput]   = useState('');
    const [loading,  setLoading] = useState(false);
    const [err,      setErr]     = useState('');
    const endRef = useRef();

    useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [msgs]);

    useEffect(() => {
        if (!selId) { setMsgs([]); return; }
        apiFetch(`/api/chat/${selId}`)
            .then(d => setMsgs((d.history || []).map(h => ({ q: h.question, a: h.answer }))))
            .catch(() => {});
    }, [selId]);

    async function send() {
        if (!input.trim() || !selId || loading) return;
        const q = input.trim();
        setMsgs(prev => [...prev, { q, a: null }]);
        setInput(''); setErr(''); setLoading(true);
        try {
            const d = await apiFetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ analysis_id: selId, question: q }),
            });
            setMsgs(prev => [...prev.slice(0, -1), { q, a: d.answer }]);
        } catch (e) {
            setErr(e.message);
            setMsgs(prev => prev.slice(0, -1));
        } finally { setLoading(false); }
    }

    if (!selId) return (
        <div className="chat-container" style={{height:'calc(100vh - 120px)'}}>
            <div className="chat-empty"><i className="fas fa-comments" style={{fontSize:'3rem',marginBottom:'1rem'}}></i><h3>No Analysis Selected</h3><p>Upload a bone marrow image first.</p></div>
        </div>
    );

    return (
        <div className="chat-container" style={{height:'calc(100vh - 120px)'}}>
            <div className="chat-messages">
                {msgs.length === 0 && !loading && (
                    <div className="chat-empty"><i className="fas fa-microscope" style={{fontSize:'3rem',marginBottom:'1rem'}}></i><h3>Ask About This Analysis</h3><p>Type a question about the bone marrow findings.</p></div>
                )}
                {msgs.map((m, i) => (
                    <React.Fragment key={i}>
                        <div className="msg-wrap user"><div className="msg-inner"><div className="avatar user">You</div><div className="msg-text">{m.q}</div></div></div>
                        {m.a != null && (
                            <div className="msg-wrap assistant"><div className="msg-inner"><div className="avatar assistant">🔬</div><div className="msg-text">{m.a}</div></div></div>
                        )}
                    </React.Fragment>
                ))}
                {loading && (
                    <div className="msg-wrap assistant"><div className="msg-inner"><div className="avatar assistant">🔬</div><div className="msg-text" style={{color:'#9ca3af'}}>Thinking…</div></div></div>
                )}
                {err && <div style={{padding:'0 1rem'}}><div className="error-box">Error: {err}</div></div>}
                <div ref={endRef} />
            </div>
            <div className="chat-input-area">
                <div className="chat-input-row">
                    <textarea className="chat-input" rows="1" placeholder="Ask a question about this analysis…"
                        value={input} onChange={e => setInput(e.target.value)} disabled={loading}
                        style={{minHeight:'46px',maxHeight:'180px'}}
                        onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                        onInput={e => { e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'; }}
                    />
                    <button className="send-btn" onClick={send} disabled={!input.trim() || loading}><i className="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    );
}

/* ── ReportTab ── */
function ReportTab({ selId }) {
    const [report,  setReport]  = useState(null);
    const [loading, setLoading] = useState(false);
    const [err,     setErr]     = useState('');

    function loadReport(regen) {
        if (!selId) { setReport(null); setErr(''); return; }
        setLoading(true); setErr(''); setReport(null);
        const url = '/api/analysis-report/' + selId + (regen ? '?regenerate=1' : '');
        apiFetch(url)
            .then(d => { setReport(d); setLoading(false); })
            .catch(e => { setErr(e.message); setLoading(false); });
    }

    useEffect(() => { loadReport(false); }, [selId]);

    if (!selId) return (
        <div className="card">
            <div className="empty-state"><i className="fas fa-file-medical"></i><h3>No Analysis Selected</h3><p>Upload an image first.</p></div>
        </div>
    );
    if (loading) return <div className="loading"><i className="fas fa-spinner"></i><p>Generating comprehensive RAG report…</p></div>;
    if (err)     return <div className="card"><div className="error-box"><strong>Report generation failed:</strong> {err}<br/><small>Check the server console for details.</small></div></div>;
    if (!report?.sections) return <div className="card"><div className="empty-state"><i className="fas fa-exclamation-circle"></i><h3>No Report Data</h3></div></div>;

    return (
        <div>
            <div className="report-header">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div>
                        <h1>Bone Marrow Cytomorphology Report</h1>
                        <p style={{color:'#718096',marginTop:'.25rem'}}>
                            Clinical Analysis: <strong>{report.case_id}</strong> &nbsp;·&nbsp; Generated: {new Date(report.generated_at).toLocaleString()}
                        </p>
                    </div>
                    <button className="regen-btn" onClick={() => loadReport(true)} title="Regenerate report with fresh LLM analysis">
                        <i className="fas fa-sync-alt" style={{marginRight:'6px'}}></i>Regenerate
                    </button>
                </div>
            </div>
            {report.warning && <div className="report-warning" role="alert">{report.warning}</div>}
            {report.sections.map((sec, i) => (
                <div key={i} className="report-section">
                    <h3>{sec.title}</h3>
                    <div className="report-text">{sec.content}</div>
                    {sec.cell_images && sec.cell_images.length > 0 && (
                        <div className="report-imgs">
                            {sec.cell_images.map((p, j) => (
                                <img key={j} src={`/api/image/${encodeURIComponent(p)}`} alt={`cell-${j}`}
                                     onError={e => { e.target.style.display='none'; }} />
                            ))}
                        </div>
                    )}
                </div>
            ))}
        </div>
    );
}

/* ── CellsTab ── */
function CellsTab({ selId }) {
    const [cells,   setCells]   = useState([]);
    const [filter,  setFilter]  = useState('All');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!selId) { setCells([]); return; }
        setLoading(true);
        apiFetch(`/api/cells/${selId}`)
            .then(d => { setCells(d.cells || []); setLoading(false); })
            .catch(() => setLoading(false));
    }, [selId]);

    if (!selId) return (
        <div className="card">
            <div className="empty-state"><i className="fas fa-microscope"></i><h3>No Analysis Selected</h3></div>
        </div>
    );
    if (loading) return <div className="loading"><i className="fas fa-spinner"></i><p>Loading cells…</p></div>;

    const types   = ['All', ...Array.from(new Set(cells.map(c => c.class)))];
    const visible = filter === 'All' ? cells : cells.filter(c => c.class === filter);

    return (
        <div className="card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
                <h3 className="card-title" style={{margin:0}}>{visible.length} Cells Detected</h3>
                <select value={filter} onChange={e => setFilter(e.target.value)}
                    style={{padding:'.4rem .75rem',borderRadius:'6px',border:'1px solid #e2e8f0',fontSize:'.85rem'}}>
                    {types.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
            </div>
            {visible.length === 0
                ? <div className="empty-state" style={{padding:'2rem'}}><p>No cells{filter!=='All'?` for "${filter}"`:''}</p></div>
                : <div className="cell-grid">
                    {visible.map((cell, i) => {
                        const conf = safeConf(cell.confidence);
                        return (
                            <div key={cell.id || i} className="cell-card">
                                {cell.image_path
                                    ? <img src={`/api/image/${encodeURIComponent(cell.image_path)}`} alt={cell.class}
                                           onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                    : null}
                                <div className="cell-img-placeholder" style={{display: cell.image_path ? 'none' : 'flex'}}>No Image</div>
                                <div className="cell-name">{cell.class}</div>
                                <div className="cell-desc">{CELL_DESC[cell.class] || 'Bone marrow cell'}</div>
                                <div className="cell-conf">Confidence: {(conf*100).toFixed(0)}%</div>
                            </div>
                        );
                    })}
                  </div>
            }
        </div>
    );
}

/* ── History ── */
function History({ analyses, selId, onSelect, onDelete }) {
    // newest first
    const sorted = [...analyses].reverse();
    return (
        <div>
            <div style={{padding:'.85rem 1rem',fontWeight:600,fontSize:'.9rem',borderBottom:'1px solid #e2e8f0'}}>Analysis History</div>
            {sorted.length === 0
                ? <div style={{padding:'2rem',textAlign:'center',color:'#9ca3af',fontSize:'.85rem'}}>No analyses yet</div>
                : sorted.map(a => (
                    <div key={a.id} className={`hist-item ${selId===a.id?'active':''}`} onClick={() => onSelect(a.id)}>
                        <button className="del-btn" onClick={e => onDelete(a.id, e)} title="Delete"><i className="fas fa-times"></i></button>
                        {a.thumbnail && (
                            <img src={`/api/image/${encodeURIComponent(a.thumbnail)}`} alt="thumb"
                                 onError={e => e.target.style.display='none'} />
                        )}
                        <div className="hist-title">{a.case_id}</div>
                        <div className="hist-meta">{a.cells} cells · {(safeConf(a.blasts)*100).toFixed(1)}% blasts</div>
                        <div className="hist-time">{new Date(a.timestamp).toLocaleString()}</div>
                    </div>
                ))
            }
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
