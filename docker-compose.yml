version: '3.8'

services:
  # ============================================================================
  # Main Application Service
  # ============================================================================
  bone-marrow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bone-marrow-ai
    ports:
      - "8501:8501"
    environment:
      # LLM Configuration
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SYNTHESIZER_USE_LLM=${SYNTHESIZER_USE_LLM:-true}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Streamlit Configuration
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    
    volumes:
      # Persist data
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      
      # Mount configuration (optional, for hot-reload during development)
      # - ./configs:/app/configs
      # - ./app:/app/app
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - bone-marrow-network

# ============================================================================
# Networks
# ============================================================================
networks:
  bone-marrow-network:
    driver: bridge

# ============================================================================
# Volumes (optional, for persistent storage)
# ============================================================================
volumes:
  bone-marrow-data:
  bone-marrow-models:
  bone-marrow-logs:
